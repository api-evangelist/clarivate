generated: '2026-09-05'
method: probed
source: >-
  Direct anonymous POST introspection against every GraphQL endpoint Clarivate's own
  contracts and developer portal name — https://api.clarivate.com/ric/searchretrieve/v1/graphql
  (declared in openapi/clarivate-ric-searchretrieve-api-openapi.json),
  https://api.clarivate.com/derwent-graphql (declared on
  https://developer.clarivate.com/apis/ipdata-di-graphql-api) and the conventional
  https://api.clarivate.com/graphql — each with the body
  {"query":"{__schema{queryType{name}}}"}, on 2026-09-05. Every probe was paired with a
  nonsense-path CONTROL on the same host and prefix.
description: >-
  Clarivate operates GraphQL but publishes no SDL. Both named endpoints are API-key
  gated at the Kong gateway and anonymous introspection is refused, so NO schema is
  captured here and none is guessed. What the control probes add over a bare 401 is
  discrimination: api.clarivate.com answers HTTP 200 with a 1,038-byte Angular SPA shell
  for any path it does not route, so a route that answers 401 with Kong's JSON
  "No API key found in request" is DEMONSTRABLY REGISTERED on the gateway rather than
  merely plausible. /derwent-graphql passes that test. The /ipdata/* prefix does not —
  it answers the same 401 "Unauthorized" for a path that cannot exist, so a GraphQL
  route under it can be neither confirmed nor denied. One of the two confirmed surfaces
  is already deprecated. Net effect for a consumer: Clarivate's GraphQL is real,
  entitlement-gated, undocumented as a schema, and contributes nothing machine-readable
  to the estate's contract surface.
sdl_captured: false
sdl_reason: anonymous-introspection-gated
endpoints:
