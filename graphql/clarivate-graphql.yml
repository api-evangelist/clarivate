    endpoint: https://api.clarivate.com/ric/searchretrieve/v1/graphql
    declared_in: openapi/clarivate-ric-searchretrieve-api-openapi.json
    portal: https://developer.clarivate.com/apis/ric-searchretrieve-api
    state: live
    description: >-
      "This graphQL API provides a single access point to query various Clarivate
      content sets from multiple domains." — the spec's own summary.
    introspection:
      attempted: '2026-09-05'
      method: POST {"query":"{__schema{queryType{name}}}"}
      status: 401
      body: '{"message":"No API key found in request"}'
      result: gated
      gateway: kong
    route_confirmed: true
    route_evidence: >-
      Declared as a path in Clarivate's own published OpenAPI contract, and the host
      answers a routed 401 rather than the unrouted SPA shell.
  - name: DI GraphQL API (With Auth)
    endpoint: https://api.clarivate.com/derwent-graphql
    declared_in: https://developer.clarivate.com/apis/ipdata-di-graphql-api
    portal: https://developer.clarivate.com/apis/ipdata-di-graphql-api
    state: deprecated
    description: >-
      Portal listing reads "Authenticated access to POST /derwent-graphql" and
      "Derwent related graphql api endpoint (POST method should be secured)", under an
      "API deprecated — this API can no longer be subscribed to" banner.
    superseded_by: Intellectual Property (IP) Data API
    introspection:
      attempted: '2026-09-05'
      method: POST {"query":"{__schema{queryType{name}}}"}
      status: 401
      body: '{"message":"No API key found in request"}'
      result: gated
      gateway: kong
    route_confirmed: true
    route_evidence: >-
      CONTROL: POST https://api.clarivate.com/derwent-zzz-nope on the same host and
      prefix returned HTTP 200 with the 1,038-byte Angular SPA shell. The routed Kong
      401 on /derwent-graphql is therefore a positive signal, not a blanket wall.
  - name: conventional /graphql root
    endpoint: https://api.clarivate.com/graphql
    state: absent
    introspection:
      attempted: '2026-09-05'
      status: 404
      body: '{"message":"No static resource ui/ql."}'
      result: not-a-graphql-endpoint
    route_confirmed: false
  - name: IP Data GraphQL under /ipdata (inconclusive)
    endpoint: https://api.clarivate.com/ipdata/graphql
    state: inconclusive
    introspection:
      attempted: '2026-09-05'
      status: 401
      body: '{"message":"Unauthorized"}'
      result: gated
    route_confirmed: false
    route_evidence: >-
      CONTROL: POST https://api.clarivate.com/ipdata/zzz-nope-9999 returned the SAME
      HTTP 401 {"message":"Unauthorized"}. The /ipdata/* prefix wraps every path in an
      auth wall, so this 401 is NOT evidence a GraphQL route exists. Recorded as
      inconclusive rather than as a surface.
controls:
  - url: https://api.clarivate.com/zzz-nope-9999-graphql
    status: 200
    body: angular-spa-shell
    note: Unrouted paths on api.clarivate.com return a 1,038-byte SPA shell, not a 404.
  - url: https://api.clarivate.com/derwent-zzz-nope
    status: 200
    body: angular-spa-shell
  - url: https://api.clarivate.com/ipdata/zzz-nope-9999
    status: 401
    body: '{"message":"Unauthorized"}'
    note: Blanket auth wall on this prefix; 401 here carries no routing information.
gap:
  finding: >-
    Two GraphQL endpoints, zero published schemas. Clarivate ships no .graphql SDL, no
    schema download, and no introspection on an unauthenticated or trial credential, so
    a prospective integrator cannot see a single field before signing a subscription —
    and the catalog cannot score the GraphQL surface at all. Publishing the SDL as a
    static file next to the swagger documents on developer.clarivate.com would cost
    nothing operationally and would make the surface machine-readable.
  remedy_owner: provider
