gap:
  finding: >-
    Clarivate publishes 26 OpenAPI documents through developer.clarivate.com but no
    machine-discoverable index of them. A /.well-known/api-catalog on clarivate.com
    (RFC 9727) listing the developer-portal swagger URLs would make the whole estate
    discoverable without scraping the portal HTML, and a /.well-known/security.txt
    pointing at the existing HackerOne program would make the disclosure route
    machine-readable.
