source: >-
  Direct HTTPS probes on 2026-09-05 of every host this record knows: the registrable
  domain and www, the developer portal, and all three API hosts named in the servers[]
  blocks of the 26 harvested OpenAPI documents (api.clarivate.com,
  incites-api.clarivate.com, wos-api.clarivate.com), plus www.cortellis.com.
description: >-
  Clarivate serves NO /.well-known document on any host. Two distinct false-positive
  shapes were hit and are recorded here so a later run does not mistake either for a
  document: clarivate.com/www.clarivate.com return an HTTP 404 with a full WordPress
  404 page body, and all three API hosts return HTTP 200 with the 1,038-byte Angular
  single-page-app shell (`<!DOCTYPE html> ... data-critters-container`) for EVERY
  /.well-known/* path, including paths that cannot exist. A 200 carrying an SPA shell
  is not a document, so NO WellKnown, SecurityTxt or AgentCard pointer is emitted from
  this probe. www.cortellis.com is behind a Cloudflare interstitial (403 "Just a
  moment...") and could not be read.
