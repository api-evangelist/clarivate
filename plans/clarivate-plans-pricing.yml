notes:
  - >-
    13 published plan rows across five APIs: the Starter API's three
    plans, the Expanded API's seven, and one each for Journals, Researcher and InCites.
  - >-
    No plan carries a currency amount anywhere on the developer portal. Access to every
    non-trial plan is gated on a product subscription and approval by Clarivate.
  - >-
    The other 21 APIs on the portal (Cortellis, Derwent, Converis, EndNote, SUSHI, RIC,
    IP Data) publish no plan table at all — they read "Contact us" or "All requests are
    reviewed against your contract and use case(s) prior to being approved".
