created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: >-
  The "Plans" and "Throttling Configuration" sections published on each API detail
  page of the Clarivate Developer Portal —
  https://developer.clarivate.com/apis/wos-starter,
  https://developer.clarivate.com/apis/wos,
  https://developer.clarivate.com/apis/wos-journal,
  https://developer.clarivate.com/apis/wos-researcher and
  https://developer.clarivate.com/apis/incites (all HTTP 200 on 2026-09-05).
description: >-
  Clarivate publishes NO money price for any API. Every plan below is an entitlement
  tier attached to a Web of Science, InCites or product subscription, and the published
  numbers are request allowances, not prices — the portal states plainly that "the
  plans are not visible during the subscription process" for the Expanded API and that
  Clarivate configures the tier from the institution's contract. The one plan anyone
  can obtain without a subscription is the Web of Science Starter API Free Trial Plan
  at 50 requests/day. This file replaces a 2026-05-04 scaffold that invented Free /
  Professional / Enterprise tiers with 1,000 and 100,000 request quotas; none of those
  values existed at Clarivate.
pricing_model: subscription-entitlement
currency: null
public_price_list: false
plan_count: 13
