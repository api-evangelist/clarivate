method: derived
source: >-
  Derived from components.schemas / definitions and their $ref graph across the 26
  OpenAPI/Swagger contracts in openapi/, harvested from
  https://developer.clarivate.com/apis/<api>/swagger on 2026-09-05. Identifier
  semantics cross-checked against the field-tag tables published in the Web of Science
  Starter, Journals and Researcher contract descriptions.
description: >-
  The entity graph Clarivate's published contracts actually declare. It is not one
  model: each product family carries its own schema namespace with no shared
  components, so the same real-world thing (a document, an organization, a person)
  is a different type in Web of Science, InCites, Derwent IP Data and Converis. The
  join keys between them are the scholarly identifier schemes — DOI, ISSN/eISSN,
  ISBN, PMID, ORCID, ResearcherID and the Web of Science UT accession number — not
  Clarivate-internal foreign keys.
identifier_schemes:
  - id: UT
    note: Web of Science accession number — the primary key for a document across Starter, Expanded, InCites and Reviewer Locator.
  - id: DOI
    note: Digital Object Identifier; a documented search field tag (DO) and a response field.
  - id: ISSN / eISSN
    note: Journal identifiers; the primary lookup key for the Journals API (/journals/{id}).
  - id: ISBN
    note: Book identifier, carried on Starter and Lite document records.
  - id: PMID
    note: PubMed identifier, carried on Starter document records.
  - id: ORCID
    note: Researcher identifier; a first-class search field of the Researcher API and present on Reviewer Connect and Reviewer Locator.
  - id: ResearcherID (RID)
    note: Clarivate's own researcher identifier, joinable to ORCID via the Researcher API.
  - id: categoryCode
    note: Two-character Web of Science (ASCA) category code used by the Journals and InCites APIs.
domains:
  - name: Publications & citations
    apis: ["wos-starter", "wos", "woslite"]
    note: Documents, sources, authors, keywords, citation counts.
  - name: Journals & metrics
    apis: ["wos-journal", "incites"]
    note: Journals, categories, Journal Impact Factor and JCI metrics, document-level metrics.
  - name: Researchers & peer review
    apis: ["wos-researcher", "reviewer-connect", "wosrl-api"]
    note: Researcher profiles, ORCID/RID identity, reviewer matching and recognition.
  - name: Intellectual property
    apis: ["ipdata-api", "dss-search-api", "patentmonitor-innography"]
    note: Patents, trademarks, designs, case law, Derwent families and sequence-search reports.
  - name: Research information management
    apis: ["converisreadapi", "cud-api", "converis-additional-api", "legacy-api"]
    note: Converis entities and link entities in the customer's own instance.
  - name: Life sciences & healthcare
    apis: ["ric-agent-hub-api", "ric-ai-api", "ric-download-api", "ric-searchretrieve-api", "lsh-download-ext-client", "cortellis-api-collection", "cddi-counter-five"]
    note: Drug pipeline, clinical trials, knowledge-graph retrieval and data-product downloads.
  - name: Usage reporting
    apis: ["sushi-api", "sushi-status-api", "cddi-counter-five"]
    note: COUNTER R5/R5.1 usage reports harvested over NISO SUSHI.
  - name: Reference management
    apis: ["endnote"]
    note: EndNote library references and attachments (deprecated API).
