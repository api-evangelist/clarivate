not_covered:
  note: >-
    No skill was written for the Converis CUD, Converis Additional, EndNote or Derwent
    Sequence Search write surfaces. Those are the four APIs that mutate state, and
    Clarivate documents no idempotency mechanism, no dry-run mode and no reversal
