openapi: 3.2.0
info:
  contact:
    email: Derwent.support@clarivate.com
    name: Derwent API
  description: Derwent APIs provide seamless access to enriched patent data, enabling users to enhance their research capabilities and make faster, more informed decisions.
  termsOfService: https://clarivate.com/legal-center/terms-of-business/product-service-terms/
  title: Intellectual Property (IP) Data Trademarks API
  version: 1.0.7
servers:
- url: https://api.clarivate.com
security:
- key: []
tags:
- name: Trademarks
paths:
  /trademarks/document/json:
    post:
      description: Call to fetch one or more full trademark documents by GUID, with possibile filters.
      operationId: getTrademarkDocuments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/records_request_trademark'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    description: Page of results
                    items:
                      properties:
                        APPLICANTS:
                          items:
                            description: '


                              Flat name: _APPLICANTS

                              Hierarchical name: APPLICANTS'
                            properties: {}
                            type: object
                          type: array
                        APPLICATION_LANGUAGE_CODE:
                          description: 'Application language code


                            Flat name: APPLICATION_LANGUAGE_CODE

                            Hierarchical name: APPLICATION_LANGUAGE_CODE'
                          example: EN
                          type: string
                        DESIGNATED_COUNTRY_CODE:
                          items:
                            description: 'Designated country code for International or ARIPO trademarks; or US State for US State trademarks


                              Flat name: DESIGNATED_COUNTRY_CODE

                              Hierarchical name: DESIGNATED_COUNTRY_CODE'
                            example: '["CN", "EM", "IN", "US"]'
                            type: string
                          type: array
                        DESIGNATION_BASIS:
                          description: 'Either MADRID_AGREEMENT, MADRID_PROTOCOL, ARIPO or USA_STATE


                            Flat name: DESIGNATION_BASIS

                            Hierarchical name: DESIGNATION_BASIS'
                          example: MADRID_PROTOCOL
                          type: string
                        DISCLAIMERS:
                          description: 'Disclaimers


                            Flat name: DISCLAIMERS

                            Hierarchical name: DISCLAIMERS'
                          example: '["BUSINESS FINANCE"]'
                          type: string
                        FIGURATIVE_ELEMENTS:
                          description: '

                            This field is of type composite but will be serialized to type object.


                            Flat name: _FIGURATIVE_ELEMENTS

                            Hierarchical name: FIGURATIVE_ELEMENTS'
                          properties: {}
                          type: object
                        GOODS_SERVICES:
                          description: '

                            This field is of type composite but will be serialized to type object.


                            Flat name: _GOODS_SERVICES

                            Hierarchical name: GOODS_SERVICES'
                          properties:
                            NAT_CLASS_DESCRIPTIONS:
                              items:
                                description: '


                                  Flat name: _GOODS_SERVICES.NAT_CLASS_DESCRIPTIONS

                                  Hierarchical name: GOODS_SERVICES.NAT_CLASS_DESCRIPTIONS'
                                properties: {}
                                type: object
                              type: array
                          type: object
                        GUID:
                          description: 'Trademark record unique global identifier


                            Flat name: GUID

                            Hierarchical name: GUID'
                          example: USAFI65E053B1C87611DEB9C6000D609921FB
                          type: string
                        ID:
                          description: 'Deprecated, use GUID. Trademark record unique global identifier


                            Flat name: ID

                            Hierarchical name: ID'
                          example: INTEIF1B28495161911E58373A272ECEBA1B7
                          type: string
                        IMAGES_TOTAL_QUANTITY:
                          description: 'Image available for the trademark record


                            Flat name: IMAGES_TOTAL_QUANTITY

                            Hierarchical name: IMAGES_TOTAL_QUANTITY'
                          example: 1
                          type: number
                        IMAGE_KIND:
                          description: 'Kind of available image. None or PUBLICATION_COPY.


                            Flat name: IMAGE_KIND

                            Hierarchical name: IMAGE_KIND'
                          example: PUBLICATION_COPY
                          type: string
                        LAST_UPDATED_DATE:
                          description: 'A date that symbolizes the last update in the database

                            This field is of type timestamp but will be serialized to type string.


                            Flat name: LAST_UPDATED_DATE

                            Hierarchical name: LAST_UPDATED_DATE'
                          example: '2022-05-05'
                          format: date
                          type: string
                        MARK_FEATURE:
                          description: 'Type of trademark


                            Flat name: MARK_FEATURE

                            Hierarchical name: MARK_FEATURE'
                          example: WORD AND DESIGN
                          type: string
                        PRIORITIES:
                          items:
                            description: '


                              Flat name: _PRIORITIES

                              Hierarchical name: PRIORITIES'
                            properties: {}
                            type: object
                          type: array
                        REGISTRATION_OFFICE_CODE:
                          description: 'Office code


                            Flat name: REGISTRATION_OFFICE_CODE

                            Hierarchical name: REGISTRATION_OFFICE_CODE'
                          example: WO
                          type: string
                        REPRESENTATIVES:
                          items:
                            description: '


                              Flat name: _REPRESENTATIVES

                              Hierarchical name: REPRESENTATIVES'
                            properties: {}
                            type: object
                          type: array
                        REPRESENTATIVE_CORRESPONDENTS:
                          items:
                            description: '


                              Flat name: _REPRESENTATIVE_CORRESPONDENTS

                              Hierarchical name: REPRESENTATIVE_CORRESPONDENTS'
                            properties: {}
                            type: object
                          type: array
                        SECOND_LANGUAGE_CODE:
                          description: 'Application second language code


                            Flat name: SECOND_LANGUAGE_CODE

                            Hierarchical name: SECOND_LANGUAGE_CODE'
                          example: FR
                          type: string
                        STATUS:
                          description: '

                            This field is of type composite but will be serialized to type object.


                            Flat name: _STATUS

                            Hierarchical name: STATUS'
                          properties: {}
                          type: object
                        WORD_MARK_SPECIFICATION:
                          description: '

                            This field is of type composite but will be serialized to type object.


                            Flat name: _WORD_MARK_SPECIFICATION

                            Hierarchical name: WORD_MARK_SPECIFICATION'
                          properties: {}
                          type: object
                      type: object
                    type: array
                  total_count:
                    description: Total number of results
                    type: number
                type: object
          description: Success
        '400':
          content:
            application/json:
              example:
                code: 1200
                error: Invalid request. Please contact support if you believe this is an error.
              schema:
                properties:
                  code:
                    description: Application error code
                    type: integer
                  error:
                    description: Error message
                    type: string
                required:
                - code
                - error
                type: object
          description: Invalid request
        '401':
          content:
            application/json:
              example:
                code: 1100
                error: Insufficient permissions to access this resources. Please contact support if you believe this is an error.
              schema:
                properties:
                  code:
                    description: Application error code
                    type: integer
                  error:
                    description: Error message
                    type: string
                required:
                - code
                - error
                type: object
          description: Unauthorized
        '403':
          content:
            application/json:
              example:
                code: 10200
                error: Insufficient permissions to use attribute values in the resources request. Please contact support if you believe this is an error
              schema:
                properties:
                  code:
                    description: Application error code
                    type: integer
                  error:
                    description: Error message
                    type: string
                required:
                - code
                - error
                type: object
          description: Forbidden
        '404':
          content:
            application/json:
              example:
                code: 1201
                error: Endpoint not found
              schema:
                properties:
                  code:
                    description: Application error code
                    type: integer
                  error:
                    description: Error message
                    type: string
                required:
                - code
                - error
                type: object
          description: Not found
        '500':
          content:
            application/json:
              example:
                code: 1300
                error: Something went wrong. Please try again, and contact support if error persists.
              schema:
                properties:
                  code:
                    description: Application error code
                    type: integer
                  error:
                    description: Error message
                    type: string
                required:
                - code
                - error
                type: object
          description: Internal server error
      summary: Call to fetch one or more full trademark documents by GUID, with possibile…
      tags:
      - Trademarks
