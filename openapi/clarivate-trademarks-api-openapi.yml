  /trademarks/search:
    post:
      description: Call to fetch one or more full trademark documents by GUID, with possibile filters.
      operationId: searchTrademarks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/search_request_trademark'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    description: Page of results
                    items:
                      properties:
                        APPLICANT_ADDRESS_COUNTRY_CODE:
                          description: 'Applicant country code


                            Flat name: APPLICANT_ADDRESS_COUNTRY_CODE

                            Hierarchical name: APPLICANTS.ADDRESS_COUNTRY_CODE'
                          example: CN
                          type: string
                        APPLICANT_ADDRESS_LINE_TEXT:
                          description: 'Applicant address


                            Flat name: APPLICANT_ADDRESS_LINE_TEXT

                            Hierarchical name: APPLICANTS.ADDRESS_LINE_TEXT'
                          example: PEKING
                          type: string
                        APPLICANT_ADDRESS_NATIVE_LINE_TEXT:
                          description: 'Applicant address in the language of the publication


                            Flat name: APPLICANT_ADDRESS_NATIVE_LINE_TEXT

                            Hierarchical name: APPLICANTS.ADDRESS_NATIVE_LINE_TEXT'
                          example: 云南省迪庆藏族自治州香格里拉市建塘镇香巴拉小镇
                          type: string
                        APPLICANT_NAME:
                          description: 'Applicant name


                            Flat name: APPLICANT_NAME

                            Hierarchical name: APPLICANTS.NAME'
                          example: LA DAWA CITY BIOTECHNOLOGY CO., LTD.
                          type: string
                        APPLICANT_NAME_NATIVE:
                          description: 'Applicant name in the language of the publication


                            Flat name: APPLICANT_NAME_NATIVE

                            Hierarchical name: APPLICANTS.NAME_NATIVE'
                          example: 香格里拉市达娃生物科技有限公司
                          type: string
                        APPLICATION_ABANDONED_DATE:
                          description: 'Abandonment date

                            This field is of type date but will be serialized to type string.


                            Flat name: APPLICATION_ABANDONED_DATE

                            Hierarchical name: STATUS.APPLICATION_ABANDONED_DATE'
                          example: '2009-05-21'
                          format: date
                          type: string
                        APPLICATION_DATE:
                          description: 'Application date

                            This field is of type date but will be serialized to type string.


                            Flat name: APPLICATION_DATE

                            Hierarchical name: STATUS.APPLICATION_DATE'
                          example: '2002-05-21'
                          format: date
                          type: string
                        APPLICATION_LANGUAGE_CODE:
                          description: 'Application language code


                            Flat name: APPLICATION_LANGUAGE_CODE

                            Hierarchical name: APPLICATION_LANGUAGE_CODE'
                          example: EN
                          type: string
                        APPLICATION_NUMBER_TEXT:
                          description: 'Application number


                            Flat name: APPLICATION_NUMBER_TEXT

                            Hierarchical name: STATUS.APPLICATION_NUMBER_TEXT'
                          type: string
                        CANCELLATION_DATE:
                          description: 'Cancellation date

                            This field is of type date but will be serialized to type string.


                            Flat name: CANCELLATION_DATE

                            Hierarchical name: STATUS.CANCELLATION_DATE'
                          example: '2009-05-21'
                          format: date
                          type: string
                        CLASSIFICATION:
                          description: 'Figurative classification system. Either VIENNA_CLASSIFICATION, MARK_IMAGE_EU_CLASSIFICATION_ENRICHED or MARK_IMAGE_US_CLASSIFICATION_ENRICHED


                            Flat name: CLASSIFICATION

                            Hierarchical name: FIGURATIVE_ELEMENTS.CLASSIFICATION'
                          example: VIENNA_CLASSIFICATION
                          type: string
                        CLASSIFICATION_CODE_ENRICHED:
                          description: 'Figurative code


                            Flat name: CLASSIFICATION_CODE_ENRICHED

                            Hierarchical name: FIGURATIVE_ELEMENTS.CLASSIFICATION_CODES_ENRICHED'
                          example: '["26.11.12", "25.07.22"]'
                          type: string
                        COUNTRY_ISO_3166_ALPHA2:
                          description: Country ISO 3166 Alpha-2
                          example: IN
                          type: string
                        COUNTRY_ISO_3166_ALPHA3:
                          description: Country ISO 3166 Alpha-3
                          example: IND
                          type: string
                        COUNTRY_TEXT:
                          description: Country Text
                          example: INDIA
                          type: string
                        CURRENT_STATUS:
                          description: 'Trademark record status (office specific)


                            Flat name: CURRENT_STATUS

                            Hierarchical name: STATUS.CURRENT_STATUS'
                          example: UNPUBLISHED APPLICATION
                          type: string
                        CURRENT_STATUS_DERIVED:
                          description: 'Harmonized trademark record status


                            Flat name: CURRENT_STATUS_DERIVED

                            Hierarchical name: STATUS.CURRENT_STATUS_DERIVED'
                          example: PENDING
                          type: string
                        DESIGNATED_COUNTRY_CODE:
                          description: 'Designated country code for International or ARIPO trademarks; or US State for US State trademarks


                            Flat name: DESIGNATED_COUNTRY_CODE

                            Hierarchical name: DESIGNATED_COUNTRY_CODE'
                          example: '["CN", "EM", "IN", "US"]'
                          type: string
                        DESIGNATION_BASIS:
                          description: 'Either MADRID_AGREEMENT, MADRID_PROTOCOL, ARIPO or USA_STATE


                            Flat name: DESIGNATION_BASIS

                            Hierarchical name: DESIGNATION_BASIS'
                          example: MADRID_PROTOCOL
                          type: string
                        DISCLAIMERS:
                          description: 'Disclaimers


                            Flat name: DISCLAIMERS

                            Hierarchical name: DISCLAIMERS'
                          example: '["BUSINESS FINANCE"]'
                          type: string
                        EXPIRY_DATE:
                          description: 'Exipiry date

                            This field is of type date but will be serialized to type string.


                            Flat name: EXPIRY_DATE

                            Hierarchical name: STATUS.EXPIRY_DATE'
                          example: '2012-05-21'
                          format: date
                          type: string
                        FILING_DATE_DERIVED:
                          description: 'Harmonized filing date

                            This field is of type date but will be serialized to type string.


                            Flat name: FILING_DATE_DERIVED

                            Hierarchical name: STATUS.FILING_DATE_DERIVED'
                          example: '2002-05-21'
                          format: date
                          type: string
                        GUID:
                          description: 'Trademark record unique global identifier


                            Flat name: GUID

                            Hierarchical name: GUID'
                          example: USAFI65E053B1C87611DEB9C6000D609921FB
                          type: string
                        GUID_DERIVED:
                          description: Trademark record unique global identifier on designated country level for International marks
                          example: CNINTEIF1B28495161911E58373A272ECEBA1B7
                          type: string
                        ID:
                          description: 'Deprecated, use GUID. Trademark record unique global identifier


                            Flat name: ID

                            Hierarchical name: ID'
                          example: INTEIF1B28495161911E58373A272ECEBA1B7
                          type: string
                        ID_DERIVED:
                          description: Deprecated, use GUID_DERIVED. Trademark record unique global identifier on designated country level for International marks
                          example: CNINTEIF1B28495161911E58373A272ECEBA1B7
                          type: string
                        IMAGES_TOTAL_QUANTITY:
                          description: 'Image available for the trademark record


                            Flat name: IMAGES_TOTAL_QUANTITY

                            Hierarchical name: IMAGES_TOTAL_QUANTITY'
                          example: 1
                          type: number
                        IMAGE_KIND:
                          description: 'Kind of available image. None or PUBLICATION_COPY.


                            Flat name: IMAGE_KIND

                            Hierarchical name: IMAGE_KIND'
                          example: PUBLICATION_COPY
                          type: string
                        INITIAL_APPLICATION_DATE:
                          description: 'Initial application date

                            This field is of type date but will be serialized to type string.


                            Flat name: INITIAL_APPLICATION_DATE

                            Hierarchical name: STATUS.INITIAL_APPLICATION_DATE'
                          example: '2002-05-21'
                          format: date
                          type: string
                        INITIAL_REGISTRATION_DATE:
                          description: 'Initial registration date

                            This field is of type date but will be serialized to type string.


                            Flat name: INITIAL_REGISTRATION_DATE

                            Hierarchical name: STATUS.INITIAL_REGISTRATION_DATE'
                          example: '2003-03-21'
                          format: date
                          type: string
                        INT_CLASS_HEADING_DERIVED:
                          description: Shortened Nice class heading
                          example: PHARMACEUTICALS
                          type: string
                        INT_CLASS_NUMBER:
                          description: 'Nice class number


                            Flat name: INT_CLASS_NUMBER

                            Hierarchical name: GOODS_SERVICES.INT_CLASS_DESCRIPTIONS.INT_CLASS_NUMBER'
                          example: '05'
                          type: string
                        INT_CLASS_TYPE_DERIVED:
                          description: Class type
                          example: GOODS
                          type: string
                        INT_GOODS_SERVICES_COMPUTER_TRANSLATION_ENRICHED_DESCRIPTION:
                          description: 'Machine translated goods and service description


                            Flat name: INT_GOODS_SERVICES_COMPUTER_TRANSLATION_ENRICHED_DESCRIPTION

                            Hierarchical name: GOODS_SERVICES.INT_CLASS_DESCRIPTIONS.INT_GOODS_SERVICES_COMPUTER_TRANSLATION_ENRICHED_DESCRIPTION'
                          example: ONLY TEST STRIPS FOR EXAMS.
                          type: string
                        INT_GOODS_SERVICES_COMPUTER_TRANSLATION_ENRICHED_LANGUAGE_CODE:
                          description: 'Machine translated goods and service description language code


                            Flat name: INT_GOODS_SERVICES_COMPUTER_TRANSLATION_ENRICHED_LANGUAGE_CODE

                            Hierarchical name: GOODS_SERVICES.INT_CLASS_DESCRIPTIONS.INT_GOODS_SERVICES_COMPUTER_TRANSLATION_ENRICHED_LANGUAGE_CODE'
