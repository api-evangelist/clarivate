openapi: 3.2.0
info:
  title: Clarivate Journals API
  version: 1.0.0
  description: 'Operations tagged Journals across 2 of this provider''s published API definitions: clarivate-wos-journal-openapi.json, clarivate-wos-starter-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.clarivate.com/apis/wos-journals/v1
- url: https://api.clarivate.com/apis/wos-starter/v1
- url: https://api.clarivate.com/apis/wos-starter/v2
security:
- key: []
tags:
- name: Journals
  description: Journals
paths:
  /journals:
    get:
      tags:
      - Journals
      summary: Search and filter across JCR Journals
      description: 'The endpoint allows to search, filter, or browse across the Journals content.


        The endpoint doesn''t require any parameter to return results, although only main information for the first ten records sorted alphabetically will be retrieved.


        To get comprehensive results, a set of parameters could be applied:

        - `q`: ISSN or title/publisher search

        - `edition`: filter by journal edition

        - `categoryCode`: filter by WoS journal category

        - `jcrYear`: filter by Journal Citation Report Year (since 1997)

        - `jif`: filter by Journal Impact Factor (JIF)

        - `jifPercentile`: filter by Journal Impact Factor Percentile (0-100)

        - `jifQuartile`: filter by Journal Impact Factor Rank Quartile

        - `jci`: filter by Journal Citation Indicator (JCI)

        - `limit`: set the limit of records on the page (1-50)

        - `page`: set the result page


        By default, all the responses are sorted alphabetically, only in case of search the results will be sorted by relevance.


        The response contains:

        - Main information about the number of records found, page and limit

        - Journals unique ID (based on JCR abbreviated title)

        - API Link to Journal record

        - Journal title

        - Search matches with the found phrase ***<em>*** *highlighted* ***</em>*** - only if parameter `q` is requested

        - Category information (unique ID, category name, and edition) - only if the parameter `categoryCode` or `edition` is requested

        - Link to the Journal Citation Report - only if parameter `jcrYear` is requested

        - Metrics information (Impact metrics) - only if parameter `jif` or `jci` is requested

        - Metrics information (Source metrics) - only if parameter `jifPercentile` is requested

        - Ranks information (JIF rank and quartile within the category) - only if parameter `jifQuartile` is requested'
      parameters:
      - name: q
        in: query
        required: false
        description: 'Free-text search by journal name (e.g. *Nature Genetics*), JCR abbreviation (e.g. *NAT GENET*), publisher (e.g. *PUBLIC LIBRARY SCIENCE*) or [ISSN / eISSN code](https://www.issn.org/understanding-the-issn/what-is-an-issn/) (e.g. *1061-4036*)


          The search logic is described in the section [Search](#search).'
        schema:
          type: string
          example: 0945-053X
      - name: edition
        in: query
        required: false
        description: 'Filter by Web of Science Citation Index. The following indexes (editions) are presented:

          - SCIE - Science Citation Index Expanded

          - SSCI - Social Sciences Citation Index

          - AHCI - Arts & Humanities Citation Index

          - ESCI - Emerging Sources Citation Index


          Multiple values are allowed, separated by a semicolon ( **;** )'
        schema:
          type: string
          enum:
          - SCIE
          - SSCI
          - AHCI
          - ESCI
      - name: categoryCode
        in: query
        required: false
        description: 'Filter journals by category identifiers.


          Each journal in JCR is assigned to at least one of the subject categories, indicating a general area of science or the social sciences. Journals may be included in more than one subject category.


          Multiple values are allowed, separated by a semicolon ( **;** )'
        schema:
          type: string
          example: IP
      - name: jcrYear
        in: query
        required: false
        description: 'Filter by Journal Citation Report year (from 1997).


          **NOTE:** The filter **jcrYear** is mandatory while using **jif**, **jifPercentile**, **jifQuartile**, and **jci** filters


          Only one value is allowed.'
        schema:
          type: integer
          format: int32
          example: 2019
      - name: jif
        in: query
        required: false
        description: 'Filter by [Journal Impact Factor](http://jcr.help.clarivate.com/Content/jcr3-glossary.htm) (JIF).


          **NOTE:** The filter **jcrYear** is mandatory while using **jif** filter


          Filter logic is described in the section [Filter by range](#range)'
        schema:
          type: string
          example: gte:5.0
      - name: jifPercentile
        in: query
        required: false
        description: 'Filter by [Journal Impact Factor Percentile](http://jcr.help.clarivate.com/Content/glossary-journal-impact-factor-percentile.htm), ranging from 0 to 100


          **NOTE:** The filter **jcrYear** is mandatory while using **jifPercentile** filter


          Filter logic is described in the section [Filter by range](#range)'
        schema:
          type: string
          example: gte:70.0 AND lte:90.0
      - name: jifQuartile
        in: query
        required: false
        description: 'Filter by JIF quartile rank for a category, from highest to lowest based on their JIF value: <br />Q1 is represented by the top 25% of journals in the category; <br />Q2 is occupied by journals in the 25 to 50% group; <br />Q3 is occupied by journals in the 50 to 75% group; <br />Q4 is occupied by journals in the 75 to 100% group.


          **NOTE:** The filter **jcrYear** is mandatory while using **jifQuartile** filter


          Multiple values are allowed, separated by a semicolon ( **;** )'
        schema:
          type: string
          enum:
          - Q1
          - Q2
          - Q3
          - Q4
      - name: jci
        in: query
        required: false
        description: 'Filter by [Journal Citation Indicator](http://jcr.help.clarivate.com/Content/jcr3-glossary.htm) (JCI).


          **NOTE:** The filter **jcrYear** is mandatory while using **jci** filter


          Filter logic is described in the section [Filter by range](#range)'
        schema:
          type: string
      - name: jciQuartile
        in: query
        required: false
        description: 'Filter by JCI quartile rank for a category, from highest to lowest based on their JCI value:

          Q1 is represented by the top 25% of journals in the category;

          Q2 is occupied by journals in the 25 to 50% group;

          Q3 is occupied by journals in the 50 to 75% group;

          Q4 is occupied by journals in the 75 to 100% group.


          **NOTE:** The filter **jcrYear** is mandatory while using **jciQuartile** filter


          Multiple values are allowed, separated by a semicolon ( **;** )'
        schema:
          type: string
          enum:
          - Q1
          - Q2
          - Q3
          - Q4
      - name: jciPercentile
        in: query
        required: false
        description: 'Filter by Journal Citation Indicator (JCI) percentile, ranging from 0 to 100


          **NOTE:** The filter **jcrYear** is mandatory while using **jciPercentile** filter


          Filter logic is described in the section [Filter by range](#range)'
        schema:
          type: string
          example: gte:70.0 AND lte:90.0
      - name: page
        in: query
        required: false
        description: Specifying a page to retrieve
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        description: Number of returned results, ranging from 1 to 50
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Journal list is sorted alphabetically when retrieving without or with fitlers only, and by relevance when searching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalList'
              examples:
                Journals full list:
