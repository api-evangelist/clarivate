  /journals/{id}/cited/year/{year}:
    get:
      tags:
      - Journals
      summary: Get journals that cite the journal for the JCR year
      description: 'Cited Journal data show how many citations a journal received in the JCR year. Cited journal data is relevant when analyzing metrics such as the Journal Impact Factor and Market Share.


        The response contains:


        - Citing **Journal** with the link to WoS Journal API entity

        - **Cited Year (all)**: The total number of citations from the citing journal. This total includes the number shown under each year and the number in the Rest column.

        - **Cited Year (10 years interval)**: Publication year of the cited articles.

        - **Cited Year (rest)**: All publication years of cited articles prior to the 10-year period defined by the table. For example, if the cited years shown are 2017-2008, the Rest column will show the number of citations from the citing journal in 2017 to articles published in the cited journal in 2007 and any earlier year.


        Please see the detailed infomration in the JCR Help page'
      parameters:
      - name: id
        in: path
        required: true
        description: Journal unique identifier
        example: PLOS_ONE
        schema:
          type: string
      - name: year
        in: path
        required: true
        description: Journal Citation Report Year (from 1997)
        example: 2017
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        description: Specifying a page to retrieve
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        description: Number of returned results, ranging from 1 to 50
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Citing journals are sorted in descending order. At the top is the journal with the largest number of citations to the cited journal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalsCited'
