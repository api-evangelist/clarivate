  /journals/{id}/citing/year/{year}:
    get:
      tags:
      - Journals
      summary: Get journals that were cited by the journal for the JCR year
      description: 'The response contains:


        - Cited **Journal** with the link to WoS Journal API entity

        - **Cited Year (all)**: The total number of citations to the cited journal. This total includes the number shown under each year and the number in the Rest column.

        - **Cited Year (10 years interval)**: Publication year of the cited articles.

        - **Cited Year (rest)**: All publication years of cited articles prior to the 10-year period defined by the table. For example, if the cited years shown are 2017-2008, the Rest column will show the number of citations from the citing journal in 2017 to articles published in the cited journal in 2007 and any earlier year.


        Please see the detailed infomration in the JCR Help page'
