  /journals/{id}:
    get:
      tags:
      - Journals
      summary: Get journal by id
      description: 'A journal entity contains:

        - basic bibliographic information about the journal, including publisher, ISSN and e-ISSN (where available), open access status, language, frequency of publication, and Web of Science categorization.

        - links to the multi-year Journal Citation Report data, starting from 1997.


        For more information about Journal inclusion in the index, please visit this page'
      parameters:
      - name: id
        in: path
        required: true
        description: 'Journal unique identifier


          Currently an identifier is a JCR abbreviation, where blank spaces are substituted with underscores (e.g. *PLOS ONE* Journal has the ID **PLOS_ONE**)'
        example: PLOS_ONE
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalRecord'
                example:
                  id: PLOS_ONE
                  name: PLoS One
                  jcrTitle: PLOS ONE
                  isoTitle: PLoS One
                  issn: 1932-6203
                  previousIssn: []
                  eIssn: 1932-6203
                  publisher:
                    name: PUBLIC LIBRARY SCIENCE
                    address: 1160 BATTERY STREET, STE 100, SAN FRANCISCO, CA 94111
                    countryRegion: USA
                  firstIssueYear: 2006
                  language: English
                  openAccess:
                    startYear: 2006
                  categories:
                  - url: /categories/ROC
                    name: MULTIDISCIPLINARY SCIENCES
                    edition: SCIE
                  journalCitationReports:
                  - year: 2019
                    url: /journals/PLOS_ONE/reports/year/2019
                  - year: 2018
                    url: /journals/PLOS_ONE/reports/year/2018
                  - year: 2017
                    url: /journals/PLOS_ONE/reports/year/2017
      operationId: getJournalsById
      x-operation-id-source: derived
    servers:
    - url: https://api.clarivate.com/apis/wos-journals/v1
  /journals/{id}/reports/year/{year}:
    get:
      tags:
      - Journals
      summary: Get journal metrics for a year
      description: 'This endpoint returns the information about Journal Citation Report by year.


        The response contains:

        - Journal name and link to the Journal entry

        - Key indications (metrics): impact, source and influence

        - Journal Impact Factor and ESI citations ranks

        - Journal Source Data

        - Three-year content analysis by country/region and organization

        - Links to the related Cited/Citing reports'
      parameters:
      - name: id
        in: path
        required: true
        description: 'Journal unique identifier


          Currently an identifier is a JCR abbreviation, where blank spaces are substituted with underscores (e.g. *PLOS ONE* Journal has the ID **PLOS_ONE**)'
        example: PLOS_ONE
        schema:
          type: string
      - name: year
        in: path
        required: true
        description: Journal Citation Report year (jcrYear)
        example: 2017
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
