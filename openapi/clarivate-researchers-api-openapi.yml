        required: true
        description: ResearcherID
        example: A-1009-2008
        schema:
          type: string
      - name: reviewType
        in: query
        required: false
        description: Review type allows a user to specifiy if only pre-publication (i.e. standard) reviews or post-publication reviews should be returned. Omitting the parameter returns both.
        schema:
          type: string
          enum:
          - post
          - pre
      - name: page
        in: query
        required: false
        description: Specifying a page to retrieve
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerReviewList'
