openapi: 3.2.0
info:
  title: Web of Science™ Researcher Researchers API
  description: This API provides researcher-level metadata from Web of Science Researcher Profiles and metrics with JSON output format and advanced search query syntax.
  version: 1.0.0
  termsOfService: https://clarivate.com/download/web-of-science-incites-apis/
  license:
    name: Clarivate Content as a Service Licence
    url: https://clarivate.com/wp-content/uploads/dlm_uploads/2019/08/Product-Service-Terms.pdf
servers:
- url: https://api.clarivate.com/apis/wos-researcher
security:
- key: []
tags:
- name: Researchers
  description: Researcher data and metrics
paths:
  /researchers:
    summary: Search researchers in Web of Science
    get:
      summary: Search researchers
      description: 'Search researchers in Web of Science Researcher Profile


        The endpoint doesn''t require any parameter to return results, although the default parameters will be used. By default, responses are sorted by relevance.'
      parameters:
      - name: q
        in: query
        required: false
        description: Query syntax for searching and filtering Researchers. The search logic is described in the section [Search](#search).
        schema:
          type: string
        examples:
          Search1:
            value: FirstName~"Eugene" AND LastName~"Garfield"
            summary: Search by firstname and lastname
          Search2:
            value: TS~"robotics"
            summary: Search by topic
          Search3:
            value: OG~"harvard"
            summary: Search by organisation enhanced name
          Search4:
            value: RID=A-1009-2008
            summary: Search by RID
          Search5:
            value: ORCID=0000-0000-000-0000
            summary: Search by ORCID
          Search6:
            value: claimStatus=false
            summary: Search by claim status
          Search7:
            value: CU~"england"
            summary: Search by country
          Search8:
            value: fullName="Benjimen"
            summary: Search by author name
          Search9:
            value: TS~"robotics" AND HCR=true
            summary: Search Highly Cited Researchers on a specific topic
      - name: page
        in: query
        required: false
        description: Specifying a page to retrieve
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        description: Number of returned results, ranging from 1 to 50
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        required: false
        description: Sort by the following attributes. If the value is not provided the records will be sorted by relevance
        schema:
          type: string
          enum:
          - NumberOfDocuments
          - PrimaryAffiliation
          - LastName
      - name: sortOrder
        in: query
        required: false
        description: Sorting order. If sorting by relevance, value must be DESC.
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: DESC
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearcherList'
              examples:
