                      count: 34304
                  - journal:
                      name: PLoS One
                      self: /journals/PLOS_ONE
                      citedJournals: 248
                    citing:
                    - year: all
                      count: 90348
                    - year: '2014'
                      count: 1223
                    - year: '2013'
                      count: 5514
                    - year: '2012'
                      count: 7198
                    - year: '2011'
                      count: 7147
                    - year: '2010'
                      count: 6751
                    - year: '2009'
                      count: 6368
                    - year: '2008'
                      count: 5775
                    - year: '2007'
                      count: 5729
                    - year: '2006'
                      count: 5192
                    - year: '2005'
                      count: 4769
                    - year: rest
                      count: 34682
      operationId: getCategoriesByIdCitedYearByYear
      x-operation-id-source: derived
  /categories/{id}/citing/year/{year}:
