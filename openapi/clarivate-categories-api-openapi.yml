openapi: 3.2.0
info:
  version: 1.0.0
  title: Web of Science™ Journals Categories API
  description: This API provides journal-level metadata and metrics for all journals in the Journal Citation Reports™ covered in the Web of Science Core Collection, including the Journal Impact Factor™ and other new metrics.
  license:
    name: Clarivate Content as a Service Licence
    url: https://clarivate.com/download/product-service-terms/
servers:
- url: https://api.clarivate.com/apis/wos-journals/v1
security:
- key: []
tags:
- name: Categories
  description: Categories
paths:
  /categories:
    get:
      tags:
      - Categories
      summary: Search and filter across the journal categories
      description: 'The endpoint allows to search, filter, or browse across the Categories content.


        The endpoint doesn''t require any parameter to return results, although only main information for the first ten records sorted alphabetically will be retrieved.


        To get comprehensive results, a set of parameters could be applied:

        - `q`: Category name

        - `edition`: filter by category edition

        - `jcrYear`: filter by Category Report Year (since 203)

        - `limit`: set the limit of records on the page (1-50)

        - `page`: set the result page


        By default, all the responses are sorted alphabetically, only in case of search the results will be sorted by relevance.


        The response contains:

        - Main information about the number of records found, page and limit

        - Category unique ID (based on category code and edition)

        - API Link to Category record

        - Category title

        - Search matches with the found phrase ***<em>*** *highlighted* ***</em>*** - only if parameter `q` is requested

        - Edition information - only if the parameter `edition` is requested

        - Link to the Category Report - only if parameter `jcrYear` is requested'
      parameters:
      - name: q
        in: query
        required: false
        description: 'Free-text search by category name.


          Search logic is described in the section [Search](#search).'
        schema:
          type: string
      - name: edition
        in: query
        required: false
        description: 'Filter by Web of Sceince Citation Index. The following indexes (editions) are presented:

          - SCIE - Science Citation Index Expanded (ournals across more than 170 disciplines)

          - SSCI - Social Sciences Citation Index (journals across more than 50 social science disciplines)


          Multiple values are allowed, separated by semicolon ( **;** )'
        schema:
          type: string
      - name: jcrYear
        in: query
        required: false
        description: 'Filter by Category Citation Report year (from 2003).


          Only one value is allowed.'
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        description: Specifying a page to retrieve
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        description: Number of returned results, ranging from 1 to 50
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
              example:
                metadata:
                  total: 272
                  limit: 10
                  page: 1
                hits:
                - id: AAC
                  self: /categories/AA_SCIE
                  name: ACOUSTICS
                - id: AFC
                  self: /categories/AF_SCIE
                  name: AGRICULTURAL ECONOMICS & POLICY
                - id: AEC
                  self: /categories/AE_SCIE
                  name: AGRICULTURAL ENGINEERING
                - id: ADC
                  self: /categories/AD_SCIE
                  name: AGRICULTURE DAIRY & ANIMAL SCIENCE
                - id: AHC
                  self: /categories/AH_SCIE
                  name: AGRICULTURE MULTIDISCIPLINARY
                - id: AMC
                  self: /categories/AM_SCIE
                  name: AGRONOMY
                - id: AQC
                  self: /categories/AQ_SCIE
                  name: ALLERGY
                - id: AYC
                  self: /categories/AY_SCIE
                  name: ANATOMY & MORPHOLOGY
                - id: AZC
                  self: /categories/AZ_SCIE
                  name: ANDROLOGY
      operationId: getCategories
      x-operation-id-source: derived
  /categories/{id}:
    get:
      tags:
      - Categories
      summary: Get a category
      description: 'The category profile provides a comprehensive overview, beginning in 2003, for each of more than 230 different subject categories in the JCR.


        Information contain the name, description and links to each JCR Category Year Report (starting from 2003)'
      parameters:
      - name: id
        in: path
        required: true
        description: Category ID, consisting of a two-letter category code and four-letter edition, separated by **_** (i.e., ***RZ_SSCI*** or ***IP_SCIE***)
        example: RU_SCIE
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRecord'
                example:
                  id: RU_SCIE
                  name: NEUROSCIENCES
                  edition: SCIE
                  categoryCode: RU
                  description: Neurosciences covers resources on all areas of basic research on the brain, neural physiology, and function in health and disease. The areas of focus include neurotransmitters, neuropeptides, neurochemistry, neural development, and neural behavior. Coverage also includes resources in neuro-endocrine and neuro-immune systems, somatosensory system, motor system and sensory motor integration, autonomic system as well as diseases of the nervous system.
                  categoryCitationReports:
                  - year: 2019
                    url: /categories/RU_SCIE/reports/year/2019
                  - year: 2018
                    url: /categories/RU_SCIE/reports/year/2018
                  - year: 2017
                    url: /categories/RU_SCIE/reports/year/2017
      operationId: getCategoriesById
      x-operation-id-source: derived
  /categories/{id}/reports/year/{year}:
    get:
      tags:
      - Categories
      summary: Get category metrics for a year
      description: 'For each JCR year all metrics related to a subject category in the Journal Citation Record are available, including: number of journals and articles in the category, Total Cites, Median Impact Factor, Aggregate Impact Factor, Aggregate Immediacy Index, and Cited and Citing category half-life.


        Please find detailed information about the metrics in the Journals by JCR Year Report output'
      parameters:
      - name: id
        in: path
        required: true
        description: Category ID
        example: RU_SCIE
        schema:
          type: string
      - name: year
        in: path
        required: true
        description: Category report year
        example: 2016
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ' '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryReports'
                example:
                  year: 2014
                  journals:
                    count: 252
                    url: /journals?category=RU_SCIE&jcrYear=2014
                  articles: 36863
                  cites: 1987755
                  jif:
                    median: 2.791
                    aggregate:
                      count: '4.010'
                      citesYearAgo: 126389
                      citesTwoYearsAgo: 158168
                      publishedYearAgo: 35974
                      publishedTwoYearsAgo: 34981
                  immediacy:
                    count: 0.853
                    citesCurrentYear: 31453
                    publishedCurrentYear: 36863
                  halfLife:
                    cited: 7.9
                    citing: 8.3
                  frequency:
                    annual: 1
                    hemiannual: 1
                    triannual: 1
                    semiannual: 22
                    quarterly: 50
                    bimonthly: 83
                    monthly: 72
                    biweekly: 0
                    weekly: 3
                    daily: 0
                    irregular: 19
                  sourceData:
                    articles:
                      count: 32596
                      references: 1638387
                    reviews:
                      count: 4267
                      references: 503851
                    other:
                      count: 16433
                      references: 36810
                  categoryData:
                    cited:
                      url: /categories/RU_SCIE/cited/year/2014
                      count: 6112
                    citing:
                      url: /categories/RU_SCIE/citing/year/2014
                      count: 12444
      operationId: getCategoriesByIdReportsYearByYear
      x-operation-id-source: derived
  /categories/{id}/cited/year/{year}:
    get:
      tags:
      - Categories
      summary: Get journals that cite all journals in the category for the JCR year
      description: 'The Cited Subject Category table lists journals that cite other journals in the subject category.


        Category Cited data contains:


        - Citing **Journal** with the link to WoS Journal API entity.

        Citing journals are sorted in descending order. At the top is the journal with the largest number of citations to the subject category.

        - **Cited journals**: The number of journals in the subject category.

        - **Cited year (all)**: The total number of citations from the citing journal. This total includes the number shown under each year and the number in the "Rest".

        - **Cited Year (10-year interval)**: The publication year of the cited articles.

        - **Cited Year (rest)**: All publication years of cited articles prior to the ten-year period defined. For example, if the cited years are 2013-2004, the Rest number will show the number of citations from the citing journal in 2012 to articles published in 2003 and earlier in journals in the subject category.


        Numbers in the "All Journals" are sums of the numbers for each year. "All others" refers to citing journals not listed by name.


        For detailed information, please visit this page'
      parameters:
      - name: id
        in: path
        required: true
        description: Category ID
        example: RU_SCIE
        schema:
          type: string
      - name: year
        in: path
        required: true
        description: JCR Year (from 2003)
        example: 2014
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        description: Specifying a page to retrieve
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        required: false
        description: Number of returned results, ranging from 1 to 50
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesCited'
                example:
                  metadata:
                    total: 6112
                    page: 1
                    limit: 10
                  hits:
                  - journal:
                      name: ALL
                    citing:
                    - year: all
                      count: 1987755
                    - year: '2014'
                      count: 31453
                    - year: '2013'
                      count: 126389
                    - year: '2012'
                      count: 158168
                    - year: '2011'
                      count: 155883
                    - year: '2010'
                      count: 148804
                    - year: '2009'
                      count: 139784
                    - year: '2008'
                      count: 127900
                    - year: '2007'
                      count: 123124
                    - year: '2006'
                      count: 111230
                    - year: '2005'
                      count: 103675
                    - year: rest
                      count: 761345
                  - journal:
                      name: ALL OTHERS (98798)
                      citedJournals: 252
                    citing:
                    - year: all
                      count: 98798
                    - year: '2014'
                      count: 1512
                    - year: '2013'
                      count: 6979
                    - year: '2012'
                      count: 8765
                    - year: '2011'
