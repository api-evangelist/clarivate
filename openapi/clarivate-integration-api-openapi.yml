                    WUID:
                      type: object
                      properties:
                        coll_id:
                          type: string
                          example: WOS
                          xml:
                            attribute: true
                    edition:
                      type: array
                      items:
                        type: object
                        properties:
                          value:
                            type: string
                            example: WOS.SSCI
                            xml:
                              attribute: true
                pub_info:
                  type: object
                  properties:
                    coverdate:
                      type: string
                      example: OCT 2019
                      xml:
                        attribute: true
                    vol:
                      type: integer
                      example: 203
                      xml:
                        attribute: true
                    journal_oas_gold:
                      type: string
                      example: N
                      xml:
                        attribute: true
                    has_citation_context:
                      type: string
                      example: Y
                      xml:
                        attribute: true
                    pubyear:
                      type: integer
                      example: 2019
                      xml:
                        attribute: true
                    issue:
                      type: integer
                      example: 27
                      xml:
                        attribute: true
                    special_issue:
                      type: string
                      example: SI
                      xml:
                        attribute: true
                    sortdate:
                      type: string
                      example: '2019-08-21'
                      xml:
                        attribute: true
                    has_abstract:
                      type: string
                      example: N
                      xml:
                        attribute: true
                    pubmonth:
                      type: string
                      example: OCT
                      xml:
                        attribute: true
                    pubtype:
                      type: string
                      example: Journal
                      xml:
                        attribute: true
                    early_access_month:
                      type: integer
                      example: 08
                      xml:
                        attribute: true
                    early_access_date:
                      type: string
                      example: AUG 2019
                      xml:
                        attribute: true
                    early_access_year:
                      type: integer
                      xml:
                        attribute: true
                    page:
                      type: object
                      properties:
                        end:
                          type: integer
                          example: 11
                          xml:
                            attribute: true
                        begin:
                          type: integer
                          example: 9
                          xml:
                            attribute: true
                        page_count:
                          type: integer
                          example: 2
                          xml:
                            attribute: true
                titles:
                  type: object
                  properties:
                    count:
                      type: integer
                      example: 6
                      xml:
                        attribute: true
                    title:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            example: source
                            xml:
                              attribute: true
                names:
                  type: object
                  properties:
                    count:
                      type: integer
                      example: 1
                      xml:
                        attribute: true
                    name:
                      type: array
                      items:
                        type: object
                        properties:
                          seq_no:
                            type: integer
                            example: 1
                            xml:
                              attribute: true
                          role:
                            type: string
                            example: author
                            xml:
                              attribute: true
                          claim_status:
                            type: boolean
                            example: false
                            xml:
                              attribute: true
                          r_id:
                            type: string
                            example: CFP-5648-2022
                            xml:
                              attribute: true
                          daisng_id:
                            type: integer
                            example: 5206054
                            xml:
                              attribute: true
                          orcid_id:
                            type: string
                            example: 0000-0001-9349-1715
                            xml:
                              attribute: true
                          addr_no:
                            type: string
                            example: 1 2 8
                            xml:
                              attribute: true
                          reprint:
                            type: string
                            example: Y
                            xml:
                              attribute: true
                          full_name:
                            type: string
                            example: Lauridsen, S. V.
                          first_name:
                            type: string
                            example: S. V.
                          last_name:
                            type: string
                            example: Lauridsen
                          display_name:
                            type: string
                            example: Lauridsen, S. V.
                          wos_standard:
                            type: string
                            example: Lauridsen, SV
                          noncore_startyear:
                            type: integer
                            example: 2011
                          noncore_endyear:
                            type: integer
                            example: 2023
                          data-item-ids:
                            type: object
                            properties:
                              data-item-id:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    example: person
                                    xml:
                                      attribute: true
                          preferred_name:
                            type: object
                            properties:
                              full_name:
                                type: string
                              last_name:
                                type: string
                              middle_name:
                                type: string
