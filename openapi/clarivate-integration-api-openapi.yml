                  properties:
                    count:
                      type: integer
                      example: 8
                      xml:
                        attribute: true
                    address_name:
                      type: array
                      items:
                        type: object
                        properties:
                          address_spec:
                            type: object
                            properties:
                              addr_no:
                                type: integer
                                example: 1
                                xml:
                                  attribute: true
                              zip:
                                type: object
                                properties:
                                  location:
                                    type: string
                                    example: AP
                                    xml:
                                      attribute: true
                              country:
