                                properties:
                                  organization:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        pref:
                                          type: string
                                          xml:
                                            attribute: true
                                  count:
                                    type: integer
                                    example: 2
                                    xml:
                                      attribute: true
                              full_address:
                                type: string
                              state:
                                type: string
                              suborganizations:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    count:
                                      type: integer
                                      example: 1
                                      xml:
                                        attribute: true
                                    suborganization:
                                      oneOf:
                                      - type: string
                                      - type: array
                                      example: Parker Inst
                          names:
                            type: object
                            properties:
                              count:
                                type: integer
                                xml:
                                  attribute: true
                              name:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    seq_no:
                                      type: integer
                                      example: 1
                                      xml:
                                        attribute: true
                                    role:
                                      example: author
                                      type: string
                                      xml:
                                        attribute: true
                                    claim_status:
                                      type: boolean
                                      xml:
                                        attribute: true
                                    full_name:
                                      type: string
                                      example: Lauridsen, S. V.
                                    addr_no:
                                      type: string
                                      example: 1
                                      xml:
                                        attribute: true
                                    reprint:
                                      type: string
                                      example: Y
                                      xml:
                                        attribute: true
                                    last_name:
                                      type: string
                                      example: Lauridsen
                                    display_name:
                                      type: string
