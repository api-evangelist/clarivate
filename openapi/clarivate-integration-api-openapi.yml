                        type: string
                    count:
                      type: integer
                      example: 2
                      xml:
                        attribute: true
                publishers:
                  type: object
                  properties:
                    publisher:
                      type: object
                      properties:
                        names:
                          type: object
                          properties:
                            count:
                              type: integer
                              example: 1
                              xml:
                                attribute: true
                            name:
                              type: object
                              properties:
                                seq_no:
                                  type: integer
                                  example: 1
                                  xml:
                                    attribute: true
                                role:
                                  type: string
                                  example: publisher
                                  xml:
                                    attribute: true
                                full_name:
                                  type: string
                                  example: TAYLOR & FRANCIS LTD
                                unified_name:
                                  type: string
