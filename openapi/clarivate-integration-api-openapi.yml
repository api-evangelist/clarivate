                                      example: S. V.
                                    data-item-ids:
                                      type: object
                                      properties:
                                        data-item-id:
                                          type: object
                                          properties:
                                            type:
                                              type: string
                                              example: person
                                              xml:
                                                attribute: true
                                    preferred_name:
                                      type: object
                                      properties:
                                        full_name:
                                          type: string
                                        last_name:
                                          type: string
                                        middle_name:
                                          type: string
                                        first_name:
                                          type: string
                reprint_addresses:
                  type: object
                  properties:
                    count:
                      type: integer
                      example: 1
                      xml:
                        attribute: true
                    address_name:
                      oneOf:
                      - type: object
                      - type: array
                      properties:
                        address_spec:
                          type: object
                          properties:
                            addr_no:
                              type: integer
