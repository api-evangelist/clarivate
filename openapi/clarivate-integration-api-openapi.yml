                                reprint:
                                  type: string
                                  example: Y
                                  xml:
                                    attribute: true
                                addr_no:
                                  type: integer
                                  example: 1
                                  xml:
                                    attribute: true
                                last_name:
                                  type: string
                                  example: Urun
                                display_name:
                                  type: string
                                  example: Urun, Yuksel
                                wos_standard:
                                  type: string
                                  example: Urun, Y
                                first_name:
                                  type: string
                                  example: Yuksel
                category_info:
                  type: object
                  properties:
                    headings:
                      type: object
                      properties:
                        heading:
                          type: string
                          example: Science &amp; Technology
                        count:
                          type: integer
                          example: 1
                          xml:
                            attribute: true
                    subheadings:
                      type: object
                      properties:
                        count:
                          type: integer
                          example: 2
                          xml:
                            attribute: true
                        subheading:
                          type: array
                          items:
                            type: string
                          example:
                          - Physical Sciences
                          - Technology
                    subjects:
                      type: object
                      properties:
                        subject:
                          type: array
                          items:
                            type: object
                            properties:
                              ascatype:
                                type: string
                                example: traditional
                                xml:
                                  attribute: true
                              code:
                                type: string
                                example: DY
                                xml:
