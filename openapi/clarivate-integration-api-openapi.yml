                                addr_no:
                                  type: integer
                                  example: 1
                                  xml:
                                    attribute: true
                                display_name:
                                  type: string
                                  example: TAYLOR & FRANCIS LTD
                        address_spec:
                          type: object
                          properties:
                            city:
                              type: string
                              example: ABINGDON
                            addr_no:
                              type: integer
                              example: 1
                              xml:
                                attribute: true
                            full_address:
                              type: string
                              example: 2-4 PARK SQUARE, MILTON PARK, ABINGDON OR14 4RN, OXON, ENGLAND
                            url_spec:
                              type: object
                              properties:
