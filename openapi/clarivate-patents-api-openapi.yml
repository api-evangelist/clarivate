                      This field will be normalized to uppercase.


                      Flat name: EARLIEST_PRIORITY_COUNTRY

                      Hierarchical name: EARLIEST_PRIORITY_COUNTRY'
                    example: US
                    type: string
                  EARLIEST_PRIORITY_DATE:
                    description: 'The earliest data of all the priority dates on the record.

                      This field is of type date but will be serialized to type string.


                      Flat name: EARLIEST_PRIORITY_DATE

                      Hierarchical name: EARLIEST_PRIORITY_DATE'
                    example: '2017-03-13'
                    format: date
                    type: string
                  EARLIEST_PRIORITY_NUMBER:
                    description: 'The earliest data of all the priority numbers on the record.

                      This field will be normalized to uppercase.


                      Flat name: EARLIEST_PRIORITY_NUMBER

                      Hierarchical name: EARLIEST_PRIORITY_NUMBER'
                    example: US62470694P
                    type: string
                  EARLIEST_PRIORITY_YEAR:
                    description: 'The earliest data of all the priority years on the record.

                      This field will be normalized to number.


                      Flat name: EARLIEST_PRIORITY_YEAR

                      Hierarchical name: EARLIEST_PRIORITY_YEAR'
