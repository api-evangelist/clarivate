components:
  schemas:
    document_availability_request_patent:
      properties:
        collection:
          description: Requested Collection
          items:
            description: Derwent Abstract Journal(DAJ)|Patent abstract Journal(PAJ)
            example: DAJ|PAJ
            type: string
          type: array
        input_type:
          description: Type of input patents list
          items:
            description: Type of patents - Publication Number( default patent) or Accession Number (dwpan)
            example: patent|dwpan
            type: string
          type: array
        patents:
          description: Patents to check
          example:
          - JP51021981B(197002753R)
          - US3201444A(196617885F)
          items:
            description: List of Publication numbers or Accession numbers for patent
            example: JP51021981B(197002753R)
            type: string
          type: array
      type: object
    match_patent:
      properties:
        MATCH:
          properties:
            ALG:
              description: Matching algorithm (currently only "DEFAULT")
              example: DEFAULT
              type: string
            MATCH_FIELDS:
              description: Fields to match. Must be one of ('assignee', 'parent_assignee')
              items:
                description: Fields to match. Must be one of ('assignee', 'parent_assignee')
                example: assignee
                type: string
              type: array
            THRESHOLD:
              description: Minimum match score
              example: 0
              type: number
            TOPN:
              default: 10
              description: Maximum number of matches to return
              example: 2
              type: number
            VALUE:
              description: A field value to attempt to match
              example: Microsoft
              type: string
          type: object
      type: object
    match_response_patent:
      properties:
        assignee:
          items:
            properties:
              count:
                description: Number of documents with this value
                type: number
              name:
                description: Value of field assignee
