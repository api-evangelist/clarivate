                          example: A1
                          type: string
                        DWPI_MANUAL_CODE:
                          description: 'A hierarchical indexing system to index the inventive and significant aspects of an invention, plus its commercial applications. The [DWPI Manual Codes](https://clarivate.com/derwent/dwpi-reference-center/dwpi-manual-code/) are consistently applied by specialist teams and divided into 20 technology sections.

