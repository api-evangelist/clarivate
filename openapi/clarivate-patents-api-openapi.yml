                          type: string
                        ESTIMATED_EXPIRATION_DATE:
                          description: 'Predictive Data provides an expiration date for an individual patent. A machine-learning algorithm examines all available data, including editorially enhanced data from the Derwent World Patents Index (DWPI), to accurately predict a patent''s expiration date. See [Expiration Date and Remaining Life](https://www.derwentinnovation.com/tip-innovation/support/help/predictive_data/Remaining_Life_and_Expiration_Date.htm) for more details.

