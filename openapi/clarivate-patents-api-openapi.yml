                      type: object
                    type: array
                  DWPI_ABSTRACT:
                    description: 'Enhanced abstract curated by the DWPI editorial technology experts. For more information see [DWPI-Abstract] (https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields.htm#abstract_dwpi)

                      This field is of type composite but will be serialized to type object.


                      Flat name: _DWPI_ABSTRACT

                      Hierarchical name: DWPI_ABSTRACT'
                    example:
                      value: 'A method of diagnosing and treating systemic Human Papilloma Virus (HPV) in particular \"viral colonies\" is disclosed. This method involves covering the skin of the feet and legs of a suspected infected human with topical applications selected from povidine iodine, potassium permanganate, aspirin, salicylic acid, natural salicin, lactic acid, alcohol, ether and any combination or mixture of them, and detecting \"HPV colony centres\" or lesions. The method of treatment of the detected HPV colony centres on the infected human includes topically administering any combination, mixture or percentage of aspirin, salicylic acid, natural salicin, paracetamol, phenacetin, whole natural grapefruit, povidine iodine and alcohol. These ingredients may be pureed, crushed, powered and or dissolved in water or grapefruit puree/juice, iodine or alcohol. The method optionally may contain the following further steps: a) initial intestinal cleansing with grapefruit seed extract(GSE) and /or Epsom salts, b) stretching and exercising the core infected area, c) i)treatment of the core infected area with firstly a topical treatment of any combination mixture or percentage of pureed whole potato and /or aloe vera stems mixed with either aspirin, salicylic acid, natural salicin, paracetamol, phenacetin, podivine iodine, alcohol, and/or epsom salts, then the core infected area is wrapped tightly in a sealed layer of plastic sheeting, and ii) secondly treating with another and final topical application consisting of any combinations, mixes and percentages of powdered Tobacco/nicotine, paracetamol, alcohol, Epsom salts, phenacetin, salicylic acid, salicin and/or aspirin. The method is supported or underpinned by a healthy lifestyle, a specified restrictive diet which avoids sugars and wheat products and certain vegetables and restricts the type and amounts of carbohydrates, a regime of daily specified supplements including salt, kelp, GSE, vitamin C, cod liver oil and Epsom salts and daily unprotected exposure to the sun."'
                    properties:
                      ACTIVITY:
                        description: 'Covers the physiological or agrochemical action of chemical or biological entities using keywords selected from a closed list.


                          Flat name: _DWPI_ABSTRACT.ACTIVITY

                          Hierarchical name: DWPI_ABSTRACT.ACTIVITY'
                        example: Cytostatic. The cytostatic activity of the composition was tested against human breast cancer cell line MDA-MB-231 using in vitro tests. The results showed that the composition exhibited an IC50 value of 0.013%.
                        type: string
                      ADVANTAGE:
                        description: 'Covers the advantages of the invention that relate to the novel aspect, as described by the author.


                          Flat name: _DWPI_ABSTRACT.ADVANTAGE

                          Hierarchical name: DWPI_ABSTRACT.ADVANTAGE'
                        example: The structure is provided on a cover for connection of a drain tube rather than allowing the drain tube to dangle or otherwise move in an uncontrolled manner behind the cover. This positioning allows for controlled drainage in a manner that is preselected and retains the drain tubes in a desired position.
                        type: string
                      DETAILED_DESCRIPTION:
                        description: 'Detailed Description may contain a full description of the main independent claim of the invention.


                          Flat name: _DWPI_ABSTRACT.DETAILED_DESCRIPTION

                          Hierarchical name: DWPI_ABSTRACT.DETAILED_DESCRIPTION'
                        example: 'A new isolated nucleic acid molecule comprises at least 700 contiguous nucleotides from SEQ ID NO. 1, or comprises coding regions encoding SEQ ID NO. 2 selected from: a polynucleotide encoding amino acids 1-373 of SEQ ID NO. 2; a polynucleotide encoding amino acids 2-373 of SEQ ID NO. 2: a polynucleotide encoding amino acids 1-197 and 236-373 of SEQ ID NO. 2, where the amino acids 197 and 236 are joined by a peptide bond;'
                        type: string
                      USE:
                        description: 'Covers all claimed and disclosed uses (applications) of the invention. If there are no disclosed uses, this is stated.


                          Flat name: _DWPI_ABSTRACT.USE

                          Hierarchical name: DWPI_ABSTRACT.USE'
                        example: Vent cover for use in a recreational vehicle (RV) i.e. all-terrain vehicle (ATV), during camping and travel trips.
                        type: string
                    type: object
                  DWPI_ABSTRACT_EXT:
                    description: 'Additional patent details about chemical or pharmaceutical patents. Examples include experimental details, drug administration, or lists of specific compounds used. For more information see [Abastract-Extension-DWPI](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields.htm#abx)

                      This field is of type composite but will be serialized to type object.


                      Flat name: _DWPI_ABSTRACT_EXT

                      Hierarchical name: DWPI_ABSTRACT_EXT'
                    properties:
                      ADMINISTRATION:
                        description: 'Provides details of dosages and methods of administration for pharmaceutical/ veterinary patents, or application rates and methods in agrochemical patents.


                          Flat name: _DWPI_ABSTRACT_EXT.ADMINISTRATION

                          Hierarchical name: DWPI_ABSTRACT_EXT.ADMINISTRATION'
                        example: Dosage is 0.01-50 mg/kg, preferably 0.05-10 mg/kg. Administration can be through subcutaneous, intraperitoneal, intravenous, intramuscular, oral, pulmonary, suppository, and transdermal route.
                        type: string
                      DEFINITION:
                        description: 'Covers the Markush chemical formula definitions from the main and other independent claims if their inclusion in the Detailed Description field causes the field character limits to be exceeded. It also covers the narrower Markush formulae definitions given in the Dependent Claims.


                          Flat name: _DWPI_ABSTRACT_EXT.DEFINITION

                          Hierarchical name: DWPI_ABSTRACT_EXT.DEFINITION'
                        example: 'Full Definition: Fossil fuels includes waste plastics such as polyolefins and other combustible solid and semi-solid wastes are pre-treated with non-toxic auxiliary materials, mixed, molded, and then stacked in stoves that are limited to non-mandatory combustion uses, and molded fuel static'
                        type: string
                      DOCUMENTATION:
                        description: 'DWPI abstract data from 1994 to 1998. Includes the complete text from the DWPI Abstract, and includes a number of possible section headings. For more information see [DWDOC](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields.htm#abstract_dwpi)


                          Flat name: _DWPI_ABSTRACT_EXT.DOCUMENTATION

                          Hierarchical name: DWPI_ABSTRACT_EXT.DOCUMENTATION'
                        example: USE The process is useful for releasing salmon eggs, anise, blood, dairy products, molluscs, fish or crustacean parts or other materials that will attract when dispersed as particulates in water. ADVANTAGE The dried fish attracting powder coating the lure dissolves slowly to release the attractant. EXAMPLE The volume ratio of powdered mix (the attractant and carrier) to the blend of adhesive and gel-forming component was 1:1-20.
                        type: string
                      EXAMPLE:
                        description: 'A summary of a full patent example which provides experimental data in support of the claimed invention, or details about how the invention is carried out in practice.


                          Flat name: _DWPI_ABSTRACT_EXT.EXAMPLE

                          Hierarchical name: DWPI_ABSTRACT_EXT.EXAMPLE'
                        example: 'A dietary supplement comprising (g): purified water (19.29), ascorbyl palmitate (0.2), sorbic acid (0.16), sucrose (25), glycerin (5), xanthan gum (0.3), concentrated borage oil (40% γ-linolenic acid) (20), concentrated marine oil (33% eicosapentaenoic acid) (15), flavor (orange/peach) (15) and colorant (orange) (0.05) was prepared.'
                        type: string
                      PRIOR_ART:
                        description: 'This field usually does not contain information and is not currently populated.


                          Flat name: _DWPI_ABSTRACT_EXT.PRIOR_ART

                          Hierarchical name: DWPI_ABSTRACT_EXT.PRIOR_ART'
                        example: When electronic apparatuses using a tin-lead solder are disposed of as general industrial wastes and exposed to the atmospheric environment, a lead component in the solder elutes to give adverse effects to human bodies; this has accelerated the development of a tin-zinc unleaded solder.
                        type: string
                      SPECIFIC_COMPOUND:
                        description: 'Specific substances which relate to, or exemplify, the novel features of the invention.


                          Flat name: _DWPI_ABSTRACT_EXT.SPECIFIC_COMPOUND

                          Hierarchical name: DWPI_ABSTRACT_EXT.SPECIFIC_COMPOUND'
                        example: SPECIFIC SEQUENCES- Specifically claimed is stress-phosphorylated endoplasmic reticulum protein, Nogo B, comprising 373 amino acids (SEQ ID NO. 2), and encoded by a nucleic acid comprising 2240 bp (SEQ ID NO. 1). All sequences are fully defined in the specification.
                        type: string
                      WIDER_DISCLOSURE:
                        description: 'Identifies areas where the scope and/or novelty of the invention, as defined in the body of the specification, is broader than that of the main independent claim(s).


                          Flat name: _DWPI_ABSTRACT_EXT.WIDER_DISCLOSURE

                          Hierarchical name: DWPI_ABSTRACT_EXT.WIDER_DISCLOSURE'
                        example: 'Also disclosed are: antibodies, including monoclonal and polyclonal antibodies, that recognize all or part of the Nogo protein; a method of identifying the Nogo proteins using the antibodies; a method of identifying or quantifying expression products of the gene encoding the Nogo of the invention; a method of detecting cell stress, where the phosphorylation of the protein of the invention is detected or measured;'
                        type: string
                    type: object
                  DWPI_ACCESSION_NUMBER:
                    description: 'The DWPI Primary Accession number (also known as PAN) is a unique identifier for the whole DWPI family representing a single invention. The first four digits represent the year the record was created. DWPI has a strict family definition in which each member shares exact priorities (except for non-convention equivalents) with each and every other family member. INPADOC, in contrast, has a very broad family definition that includes divisions, continuations and continuations in part. All that is needed is a shared priority of any one member to another.

                      This field will be normalized to uppercase.


                      Flat name: DWPI_ACCESSION_NUMBER

                      Hierarchical name: DWPI_ACCESSION_NUMBER'
                    example: '2018741525'
                    type: string
                  DWPI_APPLICATION_NUMBER_BASIC:
                    description: 'The application number of the first member of the DWPI family.

                      This field will be normalized to uppercase.


                      Flat name: DWPI_APPLICATION_NUMBER_BASIC

                      Hierarchical name: DWPI_APPLICATION_NUMBER_BASIC'
                    example: WO2012EP73219A
                    type: string
                  DWPI_APPLICATION_REGISTRATION_OFFICE_BASIC:
                    description: 'Country code that is part of the application number of the basic publication for a given DWPI family and represents the first instance of the invention ex. (US).

                      This field will be normalized to uppercase.


                      Flat name: DWPI_APPLICATION_REGISTRATION_OFFICE_BASIC

                      Hierarchical name: DWPI_APPLICATION_REGISTRATION_OFFICE_BASIC'
                    example: EP
                    type: string
                  DWPI_ASSIGNEES:
                    items:
                      description: 'Standardized version of the assignee/applicant, as assigned during the review performed by DWPI editors. This standardized version is matched to our database of assignees to ensure that names are applied consistently.


                        Flat name: _DWPI_ASSIGNEES

                        Hierarchical name: DWPI_ASSIGNEES'
                      properties: {}
                      type: object
                    type: array
                  DWPI_CLASSES:
                    items:
                      description: 'The DWPI collection categorizes patent documents using two classification systems, [DWPI Class](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields/details/DWPI_Class_Details.htm) and DWPI Manual Codes. Subject specialists consistently apply these unique classification systems to the DWPI patent documents. DWPI Class is a broad, simple system, whereas DWPI Manual Codes are more detailed and granular. Both DWPI Class and DWPI Manual Codes cover all technologies within 20 subject areas, identified by Section letters A-X which are grouped into three broad categories for Chemistry, Engineering and Electronics.


                        Flat name: _DWPI_CLASSES

                        Hierarchical name: DWPI_CLASSES'
                      properties: {}
                      type: object
                    type: array
                  DWPI_DESIGNATED_OFFICE_COUNT:
                    description: 'The number of countries/regions within which protection of the DWPI family members was sought.

                      This field will be normalized to number.


                      Flat name: DWPI_DESIGNATED_OFFICE_COUNT

                      Hierarchical name: DWPI_DESIGNATED_OFFICE_COUNT'
                    example: 117
                    type: number
                  DWPI_EARLIEST_PRIORITY_DATE:
                    description: 'The earliest date for the DWPI family when the priority application was filed.

                      This field is of type date but will be serialized to type string.


                      Flat name: DWPI_EARLIEST_PRIORITY_DATE

                      Hierarchical name: DWPI_EARLIEST_PRIORITY_DATE'
                    example: '2017-04-21'
                    format: date
                    type: string
                  DWPI_FAMILY_MEMBER_COUNT:
                    description: 'The number of DWPI family members within a given family.

                      This field will be normalized to number.


                      Flat name: DWPI_FAMILY_MEMBER_COUNT

                      Hierarchical name: DWPI_FAMILY_MEMBER_COUNT'
                    example: 13
                    type: number
                  DWPI_FAMILY_STATUS:
                    description: 'DWPI Family status, dead (D) or alive (A) quickly shows you whether a DWPI patent family is currently enforceable. Patent status uses a machine-learning algorithm to examine crucial patent data to determine the vitality status of a single patent or a patent family. The factors considered to predict patent status include: expiration date, legal status data, inherited status. If a record does not have an expiration date, filing date, and/or relevant legal status data, its status may be classified as Indeterminate (I). A DWPI Family remains alive as long as at least one patent in the family is still active. When a true/false is required, indeterminate should be considered as alive. [See the detailed process used to determine the status](https://www.derwentinnovation.com/tip-innovation/support/help/predictive_data/pat_fam_status_doa.htm)

                      This field will be normalized to uppercase.


                      Flat name: DWPI_FAMILY_STATUS

                      Hierarchical name: DWPI_FAMILY_STATUS'
                    example: D
                    type: string
                  DWPI_INVENTORS:
                    items:
                      description: 'The DWPI Inventor information within a patent record.


                        Flat name: _DWPI_INVENTORS

                        Hierarchical name: DWPI_INVENTORS'
                      properties: {}
                      type: object
                    type: array
                  DWPI_KIND_CODE_BASIC:
                    description: 'Indicates the version or level of a patent document, also known as publication stage. See the list of [DWPI Kind Codes](https://www.derwentinnovation.com/tip-innovation/support/help/reference_docs/dwpi_kinds.htm)

                      This field will be normalized to uppercase.


                      Flat name: DWPI_KIND_CODE_BASIC

                      Hierarchical name: DWPI_KIND_CODE_BASIC'
                    example: A1
                    type: string
                  DWPI_MANUAL_CODES:
                    items:
                      description: 'A hierarchical indexing system to index the inventive and significant aspects of an invention, plus its commercial applications. The [DWPI Manual Codes](https://clarivate.com/derwent/dwpi-reference-center/dwpi-manual-code/) are consistently applied by specialist teams and divided into 20 technology sections.


                        Flat name: _DWPI_MANUAL_CODES

                        Hierarchical name: DWPI_MANUAL_CODES'
                      properties: {}
                      type: object
                    type: array
                  DWPI_PUBLICATION_NUMBER_BASIC:
                    description: 'The publication number of the first member of the DWPI family.

                      This field will be normalized to uppercase.


                      Flat name: DWPI_PUBLICATION_NUMBER_BASIC

                      Hierarchical name: DWPI_PUBLICATION_NUMBER_BASIC'
                    example: WO2018169585A1
                    type: string
                  DWPI_REGISTRATION_OFFICE_BASIC:
                    description: 'The registration office code (country code) of the first member of the DWPI family.

                      This field will be normalized to uppercase.


                      Flat name: DWPI_REGISTRATION_OFFICE_BASIC

                      Hierarchical name: DWPI_REGISTRATION_OFFICE_BASIC'
                    example: WO
                    type: string
                  DWPI_TITLE:
                    description: 'Provides more information than the original patent title, written specifically to enable easy review of large lists of records and covers brief details of the scope, use and novelty of the invention. For more information see [Derwent World Patents Index](https://support.clarivate.com/Patents/s/article/Derwent-World-Patents-Index-Derwent-value-added-information?language=en_US)

                      This field will be normalized to mixed-case.


                      Flat name: DWPI_TITLE

                      Hierarchical name: DWPI_TITLE'
                    example: Stacked quantum computing device, includes shielding layer which covers dielectric layer which covers control wire on dielectric substrate of second chip
                    type: string
                  DWPI_UPDATE:
                    description: 'This is a unique identification number assigned to each DWPI database update and comprises a 4-digit year followed by a 2-digit serial number (for updates before 1 Jan. 2020) or a 3-digit serial number (for updates on or after 1 Jan. 2020). The 4-digit year and 2- or 3-digit serial number the  represent the year of the update and the number of the update, respectively.

                      This field will be normalized to number.


                      Flat name: DWPI_UPDATE

                      Hierarchical name: DWPI_UPDATE'
                    example: 2021045
                    type: number
                  DWPI_UPDATE_BASIC:
                    description: 'The DWPI update number for the first member of the patent family. Find out more about the  [DWPI Data](https://www.derwentinnovation.com/tip-innovation/support/help/dwpi.htm).

                      This field will be normalized to number.


                      Flat name: DWPI_UPDATE_BASIC

                      Hierarchical name: DWPI_UPDATE_BASIC'
                    example: 199945
                    type: number
                  DW_KEYWORDS:
                    items:
                      description: 'Derwent Manual Code keywords list (multi-valued).


                        Flat name: DW_KEYWORDS

                        Hierarchical name: DW_KEYWORDS'
                      type: string
                    type: array
                  EARLIEST_PRIORITY_COUNTRY:
