                        DWPI_TITLE:
                          description: 'Provides more information than the original patent title, written specifically to enable easy review of large lists of records and covers brief details of the scope, use and novelty of the invention. For more information see [Derwent World Patents Index](https://support.clarivate.com/Patents/s/article/Derwent-World-Patents-Index-Derwent-value-added-information?language=en_US)

