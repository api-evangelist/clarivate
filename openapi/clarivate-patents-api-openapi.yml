                            value: "\"en\":\"<tsip:claimTsxm xmlns=\\\"http://schemas.thomson.com/ts/20041221/tsxm\\\" xmlns:tsip=\\\"http://schemas.thomson.com/ts/20041221/tsip\\\" tsip:no=\\\"1\\\" tsip:type=\\\"main\\\" id=\\\"cl0001\\\" num=\\\"0001\\\">1. A mould opening mechanism, comprising a static panel (4), stripper plate (6), A plate (7), plate B (8) and locating rod (5), a stripper plate (6) is connected with the A plate (7) are fixed together; plastic waste between the static panel (4) and between the stripper plate (6), plastic product located between plate A (7) and the B plate (8), a fixed panel (4) and stripper plate (6) through a locating pull rod (5) to adjust the separation distance between the two and ensure that both without departing from. wherein it further comprises a static mould opening-closing driving block (1), a movable mould inverted hook block (3) and a reverse hook (2), the static mould opening-closing driving block (1) and the static panel (4) are fixedly connected; the movable mould inverted hook block (3) and the B plate (8) is fixedly connected with the static mould opening-closing driving block (1) and the movable mould inverted hook block (3) located on the same side of the mould; the inverted hook (2) of the inner space between the stripper plate (6) and the A plate (7) to move. pulling the inverted hook (2) on the movable mould inverted hook block (3) in the process of moving downwards inverted hook block by the movable mould (3) and the static mould opening-closing driving block (1) and pressed and retracted inside space ensured in panel (4) and the stripper plate (6) of the separating plate A (7) and B plate (8) for separating, the static mould opening-closing driving block (1) is inverted \\\" L \\\" - shaped structure, the upper part and the static panel (4) is fixedly connected with the inner side of the lower end is provided with a bump structure; the bump structure is provided with a first wedge surface (11); the movable mould inverted hook block (3) is L-shaped structure, and the lower part and the B plate (8) is fixedly connected with the inner side of the upper end is provided with a barb (31) form space M; the inverted hook (2) is set on the A plate (7) sliding in slide left and right along the chute, the inverse hook mechanism (2) comprises a reversed hook the small sliding block (21) and a spring (23), the spring (23) is set on the bottom of the A plate (7) of the chute. said converse hook small slide block (21) and one end of the spring (23) is connected, the other end of the inverted hook of the slide block (21) is provided with a second oblique wedge surface (211), B plate (8) and a movable mould inverted hook block (3) moves upwards; A plate (7) and the B plate (8) firstly assembling mould and drives the plate A (7) and stripper plate (6) continues to move upwards, the inversed hooks are small slide block (21) by a spring (23) to reset force side do pop-up movement to the left, the inversed hooks are small sliding block (21) enters the space M of the moving die inverted hook block (3); the B plate (8) and the movable mould inverted hook block (3) continues to move upwards to finish the static panel (4) and the stripper plate (6), the locating pull rod (5) passes through the panel (4) is stepped hole (41) and the stripper plate (6), said plate A (7) are fixedly connected together; the locating pull rod (5) can move up and down along the step hole (41); the inverted hook (2) further comprises a limiting pin (22); the limiting pin (22) passes through the stripper plate (6) is inserted in the small barb sliding block (21) on the upper surface of the long groove (212).</tsip:claimTsxm>\",_x000D_\n_x000D_\n                 \"ZH\":\"<tsip:claimTsxm xmlns=\\\"http://schemas.thomson.com/ts/20041221/tsxm\\\" xmlns:tsip=\\\"http://schemas.thomson.com/ts/20041221/tsip\\\" id=\\\"cl0001\\\" num=\\\"0001\\\" tsip:no=\\\"1\\\" tsip:type=\\\"main\\\">1.一种三板模具开模机构，包括静模面板（4）、脱料板（6）、A板（7）、B板（8）和定位拉杆（5），脱料板（6）与A板（7）固定在一起，塑料废料位于静模面板（4）和脱料板（6）之间，塑料成品位于A板（7）和B板（8）之间，静模面板（4）和脱料板（6）通过定位拉杆（5）调节两者之间的分离距离并确保两者_x000D_\n不脱离，其特征在于：还包括静模开模驱动块（1）、动模倒钩拉块（3）和倒勾机构（2），所述静模开模驱动块（1）与所述静模面板（4）固定连接，所述动模倒钩拉块（3）与所述B板（8）固定连接，所述静模开_x000D_\n模驱动块（1）和所述动模倒钩拉块（3）位于模具的同一侧；所述倒勾机构（2）在所述脱料板（6）和所述A板（7）之间的内侧空间中移动，所述倒勾机构（2）在动模倒钩拉块（3）向下移动过程中受到所述动模倒_x000D_\n钩拉块（3）和所述静模开模驱动块（1）的拉动和挤压并缩进内侧空间中确保静模面板（4）与脱料板（6）的分离先于A板（7）和B板（8）的分离；   <br type=\\\"required\\\"/>所述静模开模驱动块（1）是倒“L” 状结构，其上部和所述静模面板（4）固定连接，其下端内侧设置有突起结构，所述突起结构上设置有第一斜楔面（11）；   <br type=\\\"required\\\"/>所述动模倒钩拉块（3）是“L”状结构，其下部和所述B板（8）固定连接，其上端内侧设置有一倒钩（31）形成倒扣空间M；   <br type=\\\"required\\\"/>所述倒勾机构（2）设置在所述A板（7）上的滑槽内沿所述滑槽左右滑动，所述倒勾机构（2）包括倒勾小滑块（21）和弹簧(23)，所述弹簧(23)设置在所述A板（7）上的滑槽的底部，所述倒勾小滑块（21）的一端和所述弹簧(23)连接，所述倒勾小滑块（21）的另一端设置有第二斜楔面（211）；   <br type=\\\"required\\\"/>合模时，B板（8）和动模倒钩拉块（3）向上移动，B板（8）和A板（7）先合模并带动A板（7）和脱料板（6）继续向上移动，倒勾小滑块（21）受弹簧（23）复位力向左边做弹出运动，倒勾小滑块（21）外端进入动模倒钩拉块（3）的倒扣空间M，B板（8）和动模倒钩拉块（3）继续向上移动完成静模面板（4）与脱料板（6）的合模；   <br type=\\\"required\\\"/>所述定位拉杆（5）穿过所述静模面板（4）上的阶梯孔（41）和所述脱料板（6）、所述A板（7）固连在一起，所述定位拉杆（5）可沿着所述阶梯孔（41）上下移动；   <br type=\\\"required\\\"/>所述倒勾机构（2）还包括限位销（22），所述限位销（22）穿过所述脱料板（6）插在所述倒勾小滑块（21）上表面的长形凹槽（212）内。</tsip:claimTsxm>\""
