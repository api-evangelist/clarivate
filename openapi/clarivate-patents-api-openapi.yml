                        DWPI_CLASSES:
                          items:
                            description: 'The DWPI collection categorizes patent documents using two classification systems, [DWPI Class](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields/details/DWPI_Class_Details.htm) and DWPI Manual Codes. Subject specialists consistently apply these unique classification systems to the DWPI patent documents. DWPI Class is a broad, simple system, whereas DWPI Manual Codes are more detailed and granular. Both DWPI Class and DWPI Manual Codes cover all technologies within 20 subject areas, identified by Section letters A-X which are grouped into three broad categories for Chemistry, Engineering and Electronics.


                              Flat name: _DWPI_CLASSES

                              Hierarchical name: DWPI_CLASSES'
                            properties: {}
                            type: object
                          type: array
                        DWPI_DESIGNATED_OFFICE_COUNT:
                          description: 'The number of countries/regions within which protection of the DWPI family members was sought.

