                        DWPI_UPDATE:
                          description: 'This is a unique identification number assigned to each DWPI database update and comprises a 4-digit year followed by a 2-digit serial number (for updates before 1 Jan. 2020) or a 3-digit serial number (for updates on or after 1 Jan. 2020). The 4-digit year and 2- or 3-digit serial number the  represent the year of the update and the number of the update, respectively.

