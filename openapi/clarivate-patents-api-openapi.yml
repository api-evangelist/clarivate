                          type: number
                        DWPI_EARLIEST_PRIORITY_DATE:
                          description: 'The earliest date for the DWPI family when the priority application was filed.

                            This field is of type date but will be serialized to type string.


                            Flat name: DWPI_EARLIEST_PRIORITY_DATE

