                        DSI_AGE_DISCOUNT:
                          description: A weighting factor for inventions.
                          example: 0.26543465
                          type: number
                        DSI_AVERAGE_SCORE:
                          description: The Derwent Strength Index score without weighting by age.
                          example: 875.875
                          type: number
                        DSI_INVENTION_GLOBALIZATION_SCORE:
                          description: 'Globalization or filing breadth. The dedication to each patented idea, measured by the level of international patent filing committed to by the applicant. The greater the level of geographic breadth attempted, the higher the investment level the idea had lavished upon it.

                            This field will be normalized to number [0-100].'
                          example: 34
                          type: number
                        DSI_INVENTION_INFLUENCE_SCORE:
                          description: 'Influence or citation score. The downstream influence on other innovators of each patented idea, compiled by patent examiners, and normalized for variation by technology sector and differences that occur by geography or language. Every combination of technical theme and geography has an expected level of patent citation over time, and we assess individual inventions in comparison to that influence curve.

                            This field will be normalized to number [0-100].'
                          example: 41
                          type: number
                        DSI_INVENTION_SUCCESS_SCORE:
                          description: 'Success or grant breadth. The proportion of the world economy that each patented idea has covered by a granted, issued patent right, providing a basis from which the rights’ owner can use their technology.

                            This field will be normalized to number [0-100].'
                          example: 59
                          type: number
                        DSI_STRENGTH_INDEX:
                          description: 'Each invention returns a Derwent Strength Index based on 4 metrics: influence, success, globalization and technical distinctiveness.

                            This field will be normalized to number [0-100].'
                          example: 67
                          type: number
                        DSI_TECHNICAL_DISTINCTIVENESS_SCORE:
                          description: The rarity of the combination of technical features and use cases presented within the patented idea, and therefore the level of technical extension the invention supports.
                          example: 51
                          type: number
                        DSI_YEARS_REMAINING:
                          description: The years remaining for the invention.
                          example: 5.308693
                          type: number
                        DWPI_ACCESSION_NUMBER:
                          description: 'The DWPI Primary Accession number (also known as PAN) is a unique identifier for the whole DWPI family representing a single invention. The first four digits represent the year the record was created. DWPI has a strict family definition in which each member shares exact priorities (except for non-convention equivalents) with each and every other family member. INPADOC, in contrast, has a very broad family definition that includes divisions, continuations and continuations in part. All that is needed is a shared priority of any one member to another.

                            This field will be normalized to uppercase.


                            Flat name: DWPI_ACCESSION_NUMBER

                            Hierarchical name: DWPI_ACCESSION_NUMBER'
                          example: '2018741525'
                          type: string
                        DWPI_APPLICATION_NUMBER_BASIC:
                          description: 'The application number of the first member of the DWPI family.

                            This field will be normalized to uppercase.


                            Flat name: DWPI_APPLICATION_NUMBER_BASIC

                            Hierarchical name: DWPI_APPLICATION_NUMBER_BASIC'
                          example: WO2012EP73219A
                          type: string
                        DWPI_APPLICATION_REGISTRATION_OFFICE_BASIC:
                          description: 'Country code that is part of the application number of the basic publication for a given DWPI family and represents the first instance of the invention ex. (US).

                            This field will be normalized to uppercase.


                            Flat name: DWPI_APPLICATION_REGISTRATION_OFFICE_BASIC

                            Hierarchical name: DWPI_APPLICATION_REGISTRATION_OFFICE_BASIC'
                          example: EP
                          type: string
                        DWPI_ASSIGNEE_CODE:
                          description: 'A unique 4-character Assignee Code assigned to a company and all of its subsidiaries.

                            This field will be normalized to uppercase.


                            Flat name: DWPI_ASSIGNEE_CODE

                            Hierarchical name: DWPI_ASSIGNEES.CODE'
                          example: GOOG-C
                          type: string
                        DWPI_ASSIGNEE_CODE_TYPE:
                          description: 'A single character representing the assignee code type. C: standard codes; N: non-standard codes; I: individual codes; R: Russian codes.

                            This field will be normalized to uppercase.'
                          example: C
                          type: string
                        DWPI_ASSIGNEE_NAME:
                          description: 'DWPI standardized assignee name, as assigned during the review performed by DWPI editors.

                            This field will be normalized to uppercase.


                            Flat name: DWPI_ASSIGNEE_NAME

                            Hierarchical name: DWPI_ASSIGNEES.NAME'
                          example: GOOGLE INC.
                          type: string
                        DWPI_CLASS:
                          description: 'The DWPI collection categorizes patent documents using two classification systems, [DWPI Class](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields/details/DWPI_Class_Details.htm) and DWPI Manual Codes. Subject specialists consistently apply these unique classification systems to the DWPI patent documents. DWPI Class is a broad, simple system, whereas DWPI Manual Codes are more detailed and granular. Both DWPI Class and DWPI Manual Codes cover all technologies within 20 subject areas, identified by Section letters A-X which are grouped into three broad categories for Chemistry, Engineering and Electronics.

                            This field will be normalized to uppercase.


                            Flat name: DWPI_CLASS

                            Hierarchical name: DWPI_CLASSES.CLASS'
                          example: A97
                          type: string
                        DWPI_CLASS_DESCRIPTION:
                          description: 'Textual description of the scope of the DWPI Classes applied to the document.

                            This field will be normalized to uppercase.


                            Flat name: DWPI_CLASS_DESCRIPTION

                            Hierarchical name: DWPI_CLASSES.DESCRIPTION'
                          example: Miscellaneous goods not specified elsewhere
                          type: string
                        DWPI_CLASS_SECTION:
                          description: 'The DWPI section, which is the highest level in the DWPI classification system. This is also shown by the first character of the DWPI Class.

                            This field will be normalized to uppercase.'
                          example: A
