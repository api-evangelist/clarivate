                          type: string
                        IPC_4:
                          description: First 4 characters of the IPC Symbol
                          example: A23D
                          type: string
                        IPC_CLASS:
                          description: 'Part of the IPC Symbols representing the second hierarchical level of the [IPC code structure](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields/details/IPC_Structure.htm).

                            This field will be normalized to uppercase.'
                          example: A23
                          type: string
                        IPC_CLASS_DESCRIPTION:
                          description: 'IPC descriptions of the second hierarchical level of the classification. The class level is the first subdivision of the section.

                            This field will be normalized to uppercase.'
                          example: FOODS OR FOODSTUFFS; TREATMENT THEREOF, NOT COVERED BY OTHER CLASSES
                          type: string
                        IPC_CURRENT:
                          description: 'The most recent IPC classifications. They overwrite/replace any earlier classifications. They can come from Front Page or EPO (DocDB, through its weekly updates, or MCD quarterly update). For more information see [IPC classification]§

                            This field will be normalized to uppercase.


                            Flat name: IPC_CURRENT

                            Hierarchical name: IPCS_CURRENT'
                          example: A23D0007005
                          type: string
                        IPC_DESCRIPTION:
                          description: 'IPC descriptions showing the technical scope of the IPC symbols.

                            This field will be normalized to uppercase.


                            Flat name: IPC_DESCRIPTION

                            Hierarchical name: IPCS.DESCRIPTION'
                          example: characterised by ingredients other than fatty acid triglycerides
                          type: string
                        IPC_SECTION:
                          description: 'IPC characters representing the first hierarchical level of the [IPC code structure](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields/details/IPC_Structure.htm). (e.g. A = Human Necessitates, B = Performing Operations; Transporting, C = Chemistry; Metallurgy, D = Textiles; Paper, E = Fixed Constructions, F = Mechanical Engineering; Lighting; Heating; Weapons; Blasting, G = Physics, H = Electricity)

                            This field will be normalized to uppercase.'
                          example: A
                          type: string
                        IPC_SECTION_DESCRIPTION:
                          description: 'IPC descriptions of the highest level of the classification.

                            This field will be normalized to uppercase.'
                          example: HUMAN NECESSITIES
                          type: string
                        IPC_SUBCLASS:
                          description: 'Part of the IPC Symbols representing the third hierarchical level of the [IPC code structure](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields/details/IPC_Structure.htm).

                            This field will be normalized to uppercase.'
                          example: A23D
                          type: string
                        IPC_SUBCLASS_DESCRIPTION:
                          description: 'IPC descriptions of the third hierarchical level of the classification. The subclass is the next subdivision of the Class level.

                            This field will be normalized to uppercase.'
                          example: EDIBLE OILS OR FATS, e.g. MARGARINES, SHORTENINGS, COOKING OILS (obtaining, refining, preserving C11B, C11C; hydrogenation C11C 3/12)
                          type: string
                        IPC_SYMBOL:
                          description: 'IPC symbols assigned to this patent.

                            This field will be normalized to uppercase.


                            Flat name: IPC_SYMBOL

                            Hierarchical name: IPCS.SYMBOL'
                          example: A23D0007005
                          type: string
                        IPC_TYPE:
                          description: 'Indicators showing whether it is Current or Original, Inventive or Additional and Core or Advanced.

                            This field will be normalized to uppercase.


                            Flat name: IPC_TYPE

                            Hierarchical name: IPCS.TYPE'
                          example: CURRENT_INVENTIVE_ADVANCED
                          type: string
                        JP_CLASS_FI_CODE:
                          description: 'FI Codes and facets assigned to patent. For more information see [JP-FI Codes](https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields.htm#ficode)

                            This field will be normalized to uppercase.


                            Flat name: JP_CLASS_FI_CODE

                            Hierarchical name: JP_CLASSES.FI_CODES'
                          example: B41J002938-301
                          type: string
                        JP_CLASS_F_TERM:
                          description: 'JP F-Terms classification scheme classifies inventions from multiple viewpoints and is not hierarchical. For more information see [JP F-Term] (https://www.derwentinnovation.com/tip-innovation/support/help/patent_fields.htm#fterm)

                            This field will be normalized to uppercase.


                            Flat name: JP_CLASS_F_TERM

                            Hierarchical name: JP_CLASSES.F_TERMS'
                          example: 2C061AP01
                          type: string
                        KIND_CODE:
                          description: 'A one-or two-character code (one alpha plus one optional numeric) that always follows the publication number. Kind Codes indicate the version or level of examination of a patent document. [Kind codes](https://clarivate.com/derwent/wp-content/uploads/sites/3/dlm_uploads/2019/08/Kind-Code-Summary.pdf]) and their meanings are country/region specific.

                            This field will be normalized to uppercase.


                            Flat name: KIND_CODE

                            Hierarchical name: KIND_CODE'
                          example: A1
                          type: string
                        LAST_UPDATED_DATE:
                          description: 'A date that symbolizes the last update in the database.

                            This field is of type timestamp but will be serialized to type string.


                            Flat name: LAST_UPDATED_DATE

                            Hierarchical name: LAST_UPDATED_DATE'
                          example: '2022-05-05'
                          format: date
                          type: string
                        OPTIMIZED_ASSIGNEES:
                          description: Text field with all assignee names separated by a vertical line symbol
                          type: string
                        PATENT_TYPE:
                          description: 'An indicator of whether a patent is an application (A), a granted patent (G) or a utility model (U). Utility models supplement the patent system by providing protection for innovations which are not regarded as inventive enough to warrant a patent grant. 90% of the Utility Models in the database originate from China, Japan, Germany and South Korea.

                            This field will be normalized to uppercase.


                            Flat name: PATENT_TYPE

                            Hierarchical name: PATENT_TYPE'
                          example: A
                          type: string
                        PUBLICATION_DATE:
                          description: 'The date a patent or application was officially published.

                            This field is of type date but will be serialized to type string.


                            Flat name: PUBLICATION_DATE

                            Hierarchical name: PUBLICATION_DATE'
                          example: '2021-07-21'
                          format: date
                          type: string
                        PUBLICATION_LANGUAGE:
                          description: 'The publication language of a record. See [language codes (ISO 639-2)](https://www.derwentinnovation.com/tip-innovation/support/help/reference_docs/iso_639.htm).

                            This field will be normalized to uppercase.


                            Flat name: PUBLICATION_LANGUAGE

                            Hierarchical name: PUBLICATION_LANGUAGE'
                          example: EN
                          type: string
                        PUBLICATION_NUMBER:
                          description: 'A unique identifier assigned to a patent publication which can represent a published application, a published grant or a utility model. A publication number will always be preceded by a country code and followed by a kind code. For more information see [Publication number formats](https://support.clarivate.com/Patents/s/article/Derwent-Innovation-Publication-Number-PN-Formats?language=en_US).

                            This field will be normalized to uppercase.


                            Flat name: PUBLICATION_NUMBER

                            Hierarchical name: PUBLICATION_NUMBER'
                          example: EP3852021A1
                          type: string
                        PUBLICATION_TYPE:
                          description: 'A single character representing the type of publication. I = Main invention publication;  T = Translation;  R = Reissued patent;  U = Utility Model;  S = Statutory Invention Publication;  P = NTIS Publication;  V = Trial Voluntary Protest Program.

                            This field will be normalized to uppercase.


                            Flat name: PUBLICATION_TYPE

                            Hierarchical name: PUBLICATION_TYPE'
                          example: I
                          type: string
                        PUBLICATION_YEAR:
                          description: 'The year a patent or application was officially published.

                            This field will be normalized to number.


                            Flat name: PUBLICATION_YEAR

                            Hierarchical name: PUBLICATION_YEAR'
                          example: 2013
                          type: number
                        REGISTRATION_OFFICE:
                          description: 'The registration office code, also known as the country code, is a [two-character code (WIPO ST.3)](https://www.derwentinnovation.com/tip-innovation/support/help/reference_docs/patent_country_codes.htm) indicating the country/region where the application has been made or the patent has been granted.

                            This field will be normalized to uppercase.


                            Flat name: REGISTRATION_OFFICE

                            Hierarchical name: REGISTRATION_OFFICE'
                          example: EP
                          type: string
                        REPRESENTATIVE_NAME:
                          description: 'Legal representatives name or law firm listed on application.

                            This field will be normalized to uppercase.


                            Flat name: REPRESENTATIVE_NAME

                            Hierarchical name: REPRESENTATIVES.NAME'
                          example: AGFA GRAPHICS NV
                          type: string
                        SERIAL_NUMBER:
                          description: 'Original Serial Number of a Patent document as appears in Patent office gazette, without country code or kind code.

                            This field will be normalized to uppercase.


                            Flat name: SERIAL_NUMBER

                            Hierarchical name: SERIAL_NUMBER'
                          example: '3852021'
                          type: string
                        ULTIMATE_PARENT:
                          description: 'Provides the entity name which has ultimate and current responsibility for the patent and who has the ability to exploit it. See [Optimized Assignee and Ultimate Parent](https://www.derwentinnovation.com/tip-innovation/support/help/predictive_data/optimized_assignee.htm) on how we determine the owners.

                            This field will be normalized to uppercase.


                            Flat name: ULTIMATE_PARENT

                            Hierarchical name: ULTIMATE_PARENTS'
                          example: ALPHABET INC.
                          type: string
