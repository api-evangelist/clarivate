                        DWPI_EARLIEST_PRIORITY_YEAR:
                          description: The earliest year for the DWPI family when the priority application was filed.
                          example: 2017
                          type: number
                        DWPI_FAMILY_MEMBER_COUNT:
                          description: 'The number of DWPI family members within a given family.

                            This field will be normalized to number.


                            Flat name: DWPI_FAMILY_MEMBER_COUNT

                            Hierarchical name: DWPI_FAMILY_MEMBER_COUNT'
                          example: 13
                          type: number
                        DWPI_FAMILY_STATUS:
                          description: 'DWPI Family status, dead (D) or alive (A) quickly shows you whether a DWPI patent family is currently enforceable. Patent status uses a machine-learning algorithm to examine crucial patent data to determine the vitality status of a single patent or a patent family. The factors considered to predict patent status include: expiration date, legal status data, inherited status. If a record does not have an expiration date, filing date, and/or relevant legal status data, its status may be classified as Indeterminate (I). A DWPI Family remains alive as long as at least one patent in the family is still active. When a true/false is required, indeterminate should be considered as alive. [See the detailed process used to determine the status](https://www.derwentinnovation.com/tip-innovation/support/help/predictive_data/pat_fam_status_doa.htm)

                            This field will be normalized to uppercase.


                            Flat name: DWPI_FAMILY_STATUS

                            Hierarchical name: DWPI_FAMILY_STATUS'
                          example: D
                          type: string
                        DWPI_INVENTOR_NAME:
                          description: 'The name of the inventor.


                            Flat name: DWPI_INVENTOR_NAME

                            Hierarchical name: DWPI_INVENTORS.NAME'
                          example: KELLY J S
                          type: string
                        DWPI_KIND_CODE_BASIC:
                          description: 'Indicates the version or level of a patent document, also known as publication stage. See the list of [DWPI Kind Codes](https://www.derwentinnovation.com/tip-innovation/support/help/reference_docs/dwpi_kinds.htm)

