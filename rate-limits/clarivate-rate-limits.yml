specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Clarivate
providerId: clarivate
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: >-
  The "Throttling Configuration" and "Plans" tables published on the Clarivate
  Developer Portal API detail pages: https://developer.clarivate.com/apis/wos-starter,
  https://developer.clarivate.com/apis/wos, https://developer.clarivate.com/apis/wos-journal,
  https://developer.clarivate.com/apis/wos-researcher, https://developer.clarivate.com/apis/incites
  (all HTTP 200 on 2026-09-05).
description: >-
  Clarivate publishes per-second and per-day request ceilings for the five Web of
  Science / InCites APIs, tied to entitlement plan rather than to a paid tier. It does
  NOT document any rate-limit response header, any 429 behaviour, or any Retry-After
  contract — so an agent can read the number in the docs but gets no runtime signal
  back from the gateway. This file replaces a 2026-05-04 scaffold that asserted
  X-RateLimit-* / RateLimit-Policy headers and 429/503 codes Clarivate has never
  documented.
limit_count: 13
headers:
  documented: false
  note: >-
    No rate-limit response headers are documented anywhere on developer.clarivate.com.
    The published throttle is a docs number only; the API gateway (a Kong-based
    wicked.haufe.io portal) is not documented as emitting X-RateLimit-*, RateLimit-* or
    Retry-After.
responseCodes:
  documented: false
  note: >-
    The status code returned on exhaustion is not published. The documented error table
    for the WoS APIs covers 400, 401, 404, 405 and 50X only — 429 does not appear.
