volume_ceilings:
  note: >-
    The Expanded API additionally meters "Full Records" — the record-retrieval volume,
    not the request count — per year (Basic 50,000 / Intermediate 250,000 /
    Advanced 1,000,000 / Premium 3,000,000) and per month on the Essentials packages
    (1,000,000 / 500,000 / 100,000). See plans/clarivate-plans-pricing.yml.
undocumented:
  - >-
    The 21 non-WoS APIs on the developer portal (Cortellis, Derwent Sequence Search,
    IP Data, Converis, EndNote, SUSHI, RIC/LSH) publish no throttle figures at all.
  - >-
    No documented rate-limit headers, no documented 429 body, no documented
    Retry-After. This is the largest agent-readiness gap in Clarivate's runtime
    semantics: a client cannot discover its remaining budget from a response.
