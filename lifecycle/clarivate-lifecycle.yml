soap_retirement_probe:
  probed: '2026-09-05'
  method: probed
  question: >-
    STEP 6b of the enrichment contract: does Clarivate still serve a WSDL anywhere? A
    published SOAP contract counts as a contract, and enterprise research/IP vendors are
    exactly where surviving WSDLs live, so the 2023 sunset was verified on the wire
    rather than taken from the release note alone.
  finding: >-
    The Web of Science SOAP estate is gone, not merely deprecated. The documented WSDL
    hosts either no longer resolve in DNS or answer every path with a 2-byte "Ok"
    health responder. NO WSDL was retrieved, so no wsdl/ artifact is written — an
    honest absence, and the correct outcome for a retirement Clarivate actually
    completed.
  documented_wsdl_locations:
    - http://search.webofknowledge.com/esti/wokmws/ws/WokSearch?wsdl
    - http://search.webofknowledge.com/esti/wokmws/ws/WokSearchLite?wsdl
    - http://search.webofknowledge.com/esti/wokmws/ws/WOKMWSAuthenticate?wsdl
  source_of_locations: >-
    http://help.incites.clarivate.com/wosWebServicesExpanded/WebServicesExpandedOverviewGroup/Introduction/WSDLFileLocations.html
    — Clarivate's own "WSDL File Locations" help page for Web of Science Web Services
    Expanded. The host help.incites.clarivate.com NO LONGER RESOLVES (DNS NXDOMAIN),
    so the documentation for the retired surface is gone along with the surface.
  probes:
    - url: https://search.webofknowledge.com/esti/wokmws/ws/WokSearch?wsdl
      status: dns-nxdomain
      note: >-
        search.webofknowledge.com is a CNAME to ws.prod-wos.com, which itself has no
        address record. The chain is dangling; nothing answers.
    - url: https://search.webofknowledge.com/esti/wokmws/ws/WOKMWSAuthenticate?wsdl
      status: dns-nxdomain
    - url: https://wsearch.webofknowledge.com/esti/wokmws/ws/WokSearch?wsdl
      status: dns-nxdomain
    - url: http://help.incites.clarivate.com/wosWebServicesExpanded/WebServicesExpandedOverviewGroup/Introduction/WSDLFileLocations.html
      status: dns-nxdomain
      note: The help site documenting the WSDL locations is itself gone.
    - url: https://ws.isiknowledge.com/esti/wokmws/ws/WokSearch?wsdl
      status: 200
      body: 'Ok'
      bytes: 2
      content_type: text/plain
      document: false
      note: >-
        A soft-200. The legacy host still resolves (AWS ALB) but returns the same
        2-byte "Ok" for every path — see the control below — so this is a health
        responder, not a WSDL.
    - url: https://ws.isiknowledge.com/esti/wokmws/ws/WOKMWSAuthenticate?wsdl
      status: 200
      body: 'Ok'
      document: false
    - url: https://ws.isiknowledge.com/esti/wokmws/ws/WokSearchLite?wsdl
      status: 200
      body: 'Ok'
      document: false
    - url: https://api.clarivate.com/?wsdl
      status: 200
      body: angular-spa-shell
      document: false
    - url: https://api.clarivate.com/api/wos?wsdl
      status: 401
      body: '{"message":"No API key found in request"}'
      document: false
      note: The REST gateway; ?wsdl is simply ignored as an unknown query parameter.
  control:
    url: https://ws.isiknowledge.com/this/path/cannot/exist-zzz9?wsdl
    status: 200
    body: 'Ok'
    note: >-
      Identical response to every "real" WSDL path. This control is what turns
      "200 OK" from a false positive into a proven absence.
  result: no-wsdl-published
  consequence: >-
    Clarivate publishes no SOAP contract today. Its machine-readable estate is the 26
    REST/OpenAPI documents on developer.clarivate.com and two gated GraphQL endpoints
    (graphql/clarivate-graphql.yml) — nothing else.
