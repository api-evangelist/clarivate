  header: null
  docs: https://developer.clarivate.com/apis
  notes: >-
    The Starter API is the only contract publishing two live versions in one
    servers[] block (v1 and v2). No migration guide for v1 to v2 is published.
deprecation:
  policy_url: null
  policy_published: false
  changelog: https://clarivate.com/academia-government/release-notes/wos-apis/
  sunset_header: false
  practice: >-
    Deprecations are announced in the release notes and marked on the portal API page
    with an "API deprecated" banner meaning the API can no longer be SUBSCRIBED to
    while existing subscriptions stay valid. For the 2023 SOAP sunset Clarivate ran
    scheduled "brownouts" — the API returning an error instead of data on announced
    dates — and added three warning headers to every response. That is a stronger
    retirement practice than most vendors run, and it is not written down anywhere as
    a policy a customer can plan against.
  notice_period: null
