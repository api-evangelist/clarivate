source: >-
  https://github.com/clarivate — the Clarivate GitHub organization, linked from
  every "Code samples (GitHub)" / "Client library & code samples (GitHub)" link on
  the API detail pages of https://developer.clarivate.com/apis. Registry presence was
  checked directly against registry.npmjs.org, pypi.org/pypi/<pkg>/json and
  search.maven.org; package names and versions were read from each repository's own
  setup.py / package.json / pom.xml on raw.githubusercontent.com. Re-run 2026-09-05:
  the full organization was enumerated over the GitHub REST API
  (api.github.com/orgs/clarivate/repos, 63 repositories, HTTP 200) rather than only the
  repos the portal links, which surfaced ten further first-party API-consuming tools;
  three previously-null versions were resolved from the repositories' own
  pyproject.toml and DESCRIPTION manifests, and the two that remain null were
  re-checked and confirmed to carry no versioned manifest at all.
description: >-
  Clarivate's first-party client libraries are generated OpenAPI clients published as
  GITHUB SOURCE ONLY. Every name below was probed against its language registry and
  every one 404s — none of these SDKs is installable from npm, PyPI, Maven Central or
  NuGet, and none of the repositories cuts a git tag or GitHub release. `version:` is
  therefore the version declared inside the repository's own package manifest and
  `published:` is the repository's last push date (the only dated release signal that
  exists for these packages). Every WoS client still declares 1.0.0, and the four
  woslite clients wrap an API the developer portal now marks as replaced by the
  Starter API. The tools[] block below is a fuller picture than the SDK block and a
  more flattering one: Clarivate's genuinely maintained open-source output is
  ANALYSIS AND INTEGRATION CODE against its own APIs, not the client libraries. Ten of
  the thirteen tools were pushed since 2024 and four since 2026, while every SDK but
  one has been untouched for a year or more. One tool, wos-amr, still ships publicly
  for the Links AMR service Clarivate sunset in 2023 and carries no archive notice.
registry_probe:
