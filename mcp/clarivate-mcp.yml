  (404) all missed, and mcp.clarivate.com does not resolve in DNS.
description: >-
  A CANDIDATE tool list only. Clarivate ships no MCP server today. It has ANNOUNCED one:
  Nexus Connect (https://clarivate.com/academia-government/nexus-connect/) is described as
  an MCP-compliant, university-branded institutional gateway that connects library and
  research systems to AI chat agents — but the page carries no endpoint, no package, no
  install command and a 'stay informed' sign-up rather than access, so there is nothing
  an agent can call. The tools below are what a server over Clarivate's existing published
  contracts would expose; they are not offered by Clarivate and must not be read as such.
deployment:
